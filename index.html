// 「はしご」表示:縦軸=半音ごとの段(目標を中心に±7)、玉=いまの声。範囲外でも端に矢印で示す
function vDraw(){
  if(!VG || !VG.alive) return;
  const cv = $('#vCanvas');
  if(cv && cv.clientWidth){
    const W = cv.clientWidth, H = cv.clientHeight, dpr = window.devicePixelRatio || 1;
    if(cv.width !== Math.round(W * dpr)){ cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    const tg = VG.targets[VG.i];
    const match = !!tg && !tg.task;
    const R = tg && (tg.task === 'lowest' || tg.task === 'highest') ? 14 : 7, top = 22, bot = H - 22, L = 46;
    const yOf = rel => (top + bot) / 2 - rel / R * ((bot - top) / 2);
    const center = match && tg ? VG.tonic + tg.semi : homeBase();
    g.textBaseline = 'middle';
    // 段(半音ごと。ドレミの段は太く、名前つき)
    for(let k = -R; k <= R; k++){
      const y = yOf(k);
      const deg = mod(Math.round(center + k) - VG.tonic, 12);
      const dia = MAJOR.includes(deg);
      g.fillStyle = dia ? 'rgba(128,128,128,.30)' : 'rgba(128,128,128,.10)';
      g.fillRect(L, y - (dia ? 1 : .5), W - L - 8, dia ? 2 : 1);
      if(match && dia){ g.fillStyle = DEG_COLOR[deg]; g.font = '800 13px "Hiragino Sans",sans-serif'; g.textAlign = 'left'; g.fillText(SOLFA[deg], 6, y); }
    }
    g.font = '800 12px "Hiragino Sans",sans-serif'; g.textAlign = 'right';
    g.fillStyle = '#E5564B'; g.fillText('▲ たかい', W - 8, 11);
    g.fillStyle = '#4C9BEA'; g.fillText('▼ ひくい', W - 8, H - 10);
    // 目標(またはゴール)の帯
    if(match && tg){
      const tol = (VG.pass ? VG.tol : 25) / 100, col = DEG_COLOR[mod(tg.semi, 12)];
      g.fillStyle = hexA(col, .25); g.fillRect(L, yOf(tol), W - L - 8, yOf(-tol) - yOf(tol));
      g.fillStyle = col; g.fillRect(L, yOf(0) - 2, W - L - 8, 4);
      g.font = '900 16px "Hiragino Sans",sans-serif'; g.textAlign = 'left';
      g.fillText('🎯 ' + vLabel(tg.semi), L + 6, yOf(0) - 16);
    }else if(tg){
      g.setLineDash([6, 5]); g.strokeStyle = 'rgba(128,128,128,.7)'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(L, yOf(0)); g.lineTo(W - 8, yOf(0)); g.stroke(); g.setLineDash([]);
      g.fillStyle = 'rgba(128,128,128,.9)'; g.font = '700 12px "Hiragino Sans",sans-serif'; g.textAlign = 'left';
      g.fillText(state.voice.home ? 'いつもの こえ' : 'ふつうの たかさ', L + 6, yOf(0) - 10);
      if(tg.task === 'high' || tg.task === 'low'){
        const a = tg.task === 'high' ? 2.5 : -2.5, b = tg.task === 'high' ? R : -R;
        g.fillStyle = 'rgba(63,191,106,.18)'; g.fillRect(L, Math.min(yOf(a), yOf(b)), W - L - 8, Math.abs(yOf(a) - yOf(b)));
        g.fillStyle = '#2E8B4E'; g.fillText(tg.task === 'high' ? '⬆ ここまで あげよう' : '⬇ ここまで さげよう', L + 6, yOf(a + (tg.task === 'high' ? 1 : -1)));
      }
      if((tg.task === 'lowest' || tg.task === 'highest') && VG.best != null){
        const b = clamp(VG.best - center, -R, R);
        g.fillStyle = '#E0A21B'; g.fillRect(L, yOf(b) - 2, W - L - 8, 4);
        g.fillText('🏁 記録 ' + midiName(VG.best), L + 6, yOf(b) + (tg.task === 'lowest' ? 14 : -12));
      }
      if((tg.task === 'up' || tg.task === 'down') && VG.seg){
        const start = (tg.task === 'up' ? VG.seg.min : VG.seg.max) - center, goal = start + (tg.task === 'up' ? 6 : -6);
        g.fillStyle = '#2E8B4E'; g.fillRect(L, yOf(clamp(goal, -R, R)) - 2, W - L - 8, 4);
        g.fillText('🏁 ゴール', L + 6, yOf(clamp(goal, -R, R)) - 12);
      }
    }
    // 軌跡
    const now = performance.now(), span = 3500, xBall = W * .62;
    const tolS = (VG.pass ? VG.tol : 25) / 100;
    const colOf = rel => !match ? '#2F7DE1' : Math.abs(rel) <= tolS ? '#2FA65A' : Math.abs(rel) <= .7 ? '#E0A21B' : '#E5564B';
    let prev = null;
    g.lineWidth = 4; g.lineCap = 'round';
    VG.trace.forEach(p => {
      const x = xBall - (now - p.t) / span * (xBall - L);
      if(x < L || p.rel === null){ prev = null; return; }
      const y = yOf(clamp(p.rel, -R - .5, R + .5));
      if(prev){ g.strokeStyle = colOf(p.rel); g.globalAlpha = .55; g.beginPath(); g.moveTo(prev.x, prev.y); g.lineTo(x, y); g.stroke(); g.globalAlpha = 1; }
      prev = {x, y};
    });
    // 玉(いまの声)と、目標への矢印
    const last = VG.trace[VG.trace.length - 1];
    if(last && last.rel !== null && now - last.t < 300 && VG.phase === 'sing'){
      const rel = last.rel, out = Math.abs(rel) > R, y = yOf(clamp(rel, -R - .5, R + .5));
      const col = colOf(rel);
      g.fillStyle = col; g.strokeStyle = '#fff'; g.lineWidth = 3;
      g.beginPath(); g.arc(xBall, y, 18, 0, Math.PI * 2); g.fill(); g.stroke();
      g.fillStyle = '#fff'; g.font = '900 15px "Hiragino Sans",sans-serif'; g.textAlign = 'center';
      g.fillText(out ? (rel > 0 ? '▲' : '▼') : '🎤', xBall, y + 1);
      if(match && Math.abs(rel) > tolS){
        const ty = yOf(0), x = xBall + 34, dirDown = rel > 0;
        g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 5;
        g.beginPath(); g.moveTo(x, y); g.lineTo(x, ty + (dirDown ? -10 : 10)); g.stroke();
        g.beginPath(); g.moveTo(x - 11, ty + (dirDown ? -14 : 14)); g.lineTo(x + 11, ty + (dirDown ? -14 : 14)); g.lineTo(x, ty + (dirDown ? 2 : -2)); g.closePath(); g.fill();
        const n = Math.abs(rel);
        g.font = '900 16px "Hiragino Sans",sans-serif'; g.textAlign = 'left';
        const txt = VG.kid ? (dirDown ? 'ひくく!' : 'たかく!') : `${n < 1 ? 'すこし' : '半音' + Math.round(n) + 'つ'}${dirDown ? '下げる' : '上げる'}`;
        g.fillText(txt, x + 16, (y + ty) / 2);
      }
    }
    // 採点までの進み具合
    if(VG.phase === 'sing' && match){
      g.fillStyle = '#3FBF6A'; g.fillRect(0, H - 5, W * Math.min(1, VG.voiced / ((tg.hold || VG.hold) * 1000)), 5);
    }
  }
  VG.raf = requestAnimationFrame(vDraw);
}

/* =====================================================================
   🚀 音階ラッシュ(時間制限つき度数あてゲーム)
   ===================================================================== */
const RUSH_LV = [
  {set:[0,4,7],               name:'ドミソ'},
  {set:[0,2,4,5,7],           name:'ドレミファソ'},
  {set:MAJOR,                 name:'長音階'},
  {set:MAJOR, oct:true,       name:'長音階・音域拡大'},
  {set:MAJOR, oct:true, kc:true, name:'転調あり'},
  {set:[0,2,3,4,5,7,9,10,11], oct:true, kc:true, name:'+♭ミ・♭シ'},
  {set:CHROMA, oct:true, kc:true, name:'12音'},
];
const RUSH_UP = 8;           // 何問正解でレベルアップ
let RU = null;
function startRush(){
  ac(); stopAll(); micStop(); droneStop();
  const kpc = ri(12);
  RU = {score:0, combo:0, maxCombo:0, lives:3, lv:0, inLv:0, n:0, ok:0, rts:[], kpc, tonic:48 + kpc, limit:6.0, q:null, ended:false, paused:true, prev:null, set:null};
  document.body.classList.add('in-game');
  showView('rush');
  buildRush();
  rushIntro(`🎼 キー ${keyName(kpc)}`);
  RU.raf = requestAnimationFrame(rushFrame);
}
function rushIntro(msg){
  const me = RU;
  RU.paused = true; RU.q = null;
  $('#ruQ').textContent = '🎼'; $('#ruQ').className = 'rush-q';
  $('#ruMsg').innerHTML = `${msg}<br><span class="small muted">ドレミファソラシド を聴いて「ド」を覚えよう</span>`;
  $('#ruBar').style.width = '100%';
  stopAll();
  const e = keyRef(RU.tonic);
  setTimeout(() => { if(RU === me && !RU.ended){ RU.paused = false; rushNext(); } }, e * 1000 + 250);
}
function rushButtons(){
  const L = RUSH_LV[RU.lv];
  if(RU.set === L.set) return;
  RU.set = L.set;
  const el = $('#ruBtns');
  el.innerHTML = degOpts(L.set).map((o, i) => `<button class="btn" data-v="${o.value}" style="background:${o.color};border-color:${o.color};color:${o.ink}">${o.html}${matchMedia('(hover:hover)').matches && i < 9 ? `<span class="kbd">${i + 1}</span>` : ''}</button>`).join('');
  el.querySelectorAll('button').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); rushAnswer(+b.dataset.v, b); }));
}
function rushNext(){
  if(!RU || RU.ended) return;
  const L = RUSH_LV[RU.lv];
  rushButtons();
  let s, tries = 0;
  do{ s = pick(L.set); }while(s === RU.prev && tries++ < 5);
  RU.prev = s;
  let m = RU.tonic + s;
  if(L.oct) m += pick([-12, 0, 0, 12]);
  while(m > 79) m -= 12;
  while(m < 43) m += 12;
  RU.q = {semi:s, midi:m, t0:performance.now(), limit:RU.limit * 1000, answered:false};
  $('#ruQ').textContent = '?'; $('#ruQ').className = 'rush-q';
  $('#ruMsg').textContent = '';
  $$('#ruBtns button').forEach(b => b.classList.remove('correct', 'wrong'));
  stopAll(); note(m, 0, .6, 1.2);
}
function rushFrame(){
  if(!RU || RU.ended) return;
  const q = RU.q;
  if(q && !q.answered && !RU.paused){
    const left = q.limit - (performance.now() - q.t0);
    const f = Math.max(0, left / q.limit);
    const bar = $('#ruBar');
    bar.style.width = (f * 100) + '%';
    bar.style.background = f > .5 ? 'var(--brand)' : f > .25 ? '#E0A21B' : '#E5564B';
    if(left <= 0) rushAnswer(null);
  }
  RU.raf = requestAnimationFrame(rushFrame);
}
function rushAnswer(semi, btn){
  const q = RU && RU.q;
  if(!q || q.answered || RU.paused || RU.ended) return;
  q.answered = true;
  const rt = performance.now() - q.t0;
  const ok = semi !== null && mod(semi, 12) === mod(q.semi, 12);
  RU.n++;
  const qEl = $('#ruQ'), msg = $('#ruMsg');
  const cbtn = $(`#ruBtns button[data-v="${mod(q.semi, 12)}"]`);
  if(ok){
    RU.ok++; RU.combo++; RU.maxCombo = Math.max(RU.maxCombo, RU.combo); RU.rts.push(rt);
    const mult = RU.combo >= 20 ? 3 : RU.combo >= 10 ? 2 : 1;
    const speed = Math.max(0, 1 - rt / q.limit);
    const pts = Math.round((100 + 150 * speed) * mult * (1 + RU.lv * .25));
    RU.score += pts;
    qEl.textContent = SOLFA[mod(q.semi, 12)]; qEl.className = 'rush-q ok';
    qEl.style.setProperty('--qc', DEG_COLOR[mod(q.semi, 12)]);
    msg.innerHTML = `<b style="color:#3FBF6A">+${pts}</b> ${speed > .7 ? '⚡はやい!' : ''}${mult > 1 ? ` <span class="fever">FEVER ×${mult}</span>` : ''}`;
    if(cbtn) cbtn.classList.add('correct');
    sfx('ok');
    RU.inLv++;
    RU.limit = Math.max(1.8, RU.limit - .12);
    rushHud();
    if(RU.inLv >= RUSH_UP && RU.lv < RUSH_LV.length - 1){
      RU.lv++; RU.inLv = 0; RU.limit = Math.min(6, RU.limit + .8);
      const L = RUSH_LV[RU.lv];
      toast(`⬆️ LEVEL ${RU.lv + 1}:${L.name}`); sfx('lv');
      if(L.kc){ RU.kpc = ri(12); RU.tonic = 48 + RU.kpc; }
      setTimeout(() => { if(RU && !RU.ended) rushIntro(`⬆️ LEVEL ${RU.lv + 1}:${L.name}${L.kc ? `<br>🔀 転調 → キー ${keyName(RU.kpc)}` : ''}`); }, 700);
      return;
    }
    if(RUSH_LV[RU.lv].kc && RU.ok % 6 === 0){
      RU.kpc = ri(12); RU.tonic = 48 + RU.kpc;
      setTimeout(() => { if(RU && !RU.ended) rushIntro(`🔀 転調 → キー ${keyName(RU.kpc)}`); }, 600);
      return;
    }
    setTimeout(() => { if(RU && !RU.ended) rushNext(); }, 420);
  }else{
    RU.combo = 0; RU.lives--;
    qEl.textContent = SOLFA[mod(q.semi, 12)]; qEl.className = 'rush-q ng';
    qEl.style.setProperty('--qc', DEG_COLOR[mod(q.semi, 12)]);
    msg.innerHTML = `${semi === null ? '⏰ 時間切れ' : '✕ ちがう'} — 正解は <b>${SOLFA[mod(q.semi, 12)]}</b>`;
    if(btn) btn.classList.add('wrong');
    if(cbtn) cbtn.classList.add('correct');
    sfx('ng');
    // 正解の音 → ドへの解決を聴かせて記憶に残す
    setTimeout(() => { if(!RU || RU.ended) return; stopAll(); const s = mod(q.semi, 12), base = q.midi - s; resolvePath(s).forEach((x, i) => note(base + x, i * .3, .5, .4)); }, 250);
    rushHud();
    const me = RU;
    if(RU.lives <= 0) setTimeout(() => { if(RU === me) rushEnd(); }, 1600);
    else setTimeout(() => { if(RU === me && !RU.ended) rushNext(); }, 1700);
  }
}
function rushHud(){
  $('#ruScore').textContent = RU.score.toLocaleString();
  $('#ruLives').textContent = '❤️'.repeat(Math.max(0, RU.lives)) + '🖤'.repeat(3 - Math.max(0, RU.lives));
  $('#ruLv').textContent = `Lv${RU.lv + 1} ${RUSH_LV[RU.lv].name}`;
  const cb = $('#ruCombo');
  cb.textContent = RU.combo >= 2 ? `${RU.combo} COMBO` : '';
  $('#v-rush').classList.toggle('is-fever', RU.combo >= 10);
  $('#v-rush').classList.toggle('is-fever3', RU.combo >= 20);
}

/* =====================================================================
   リズム拡張:マイク入力(ギター・手拍子・声)、パターン集、エコー、テンポ診断、コードチェンジ、音符表示
   ===================================================================== */

/* ---------- マイクで「音の出だし(オンセット)」を検出 ----------
   低音〜中音だけを通す(クリック音の高い成分は落ちる)→ 64サンプルごとの音量の急な立ち上がりを拾う */
const ONS = {proc:null, nodes:null, cb:null, floor:.003, prev:0, last:0, level:0, an:null};
const MIC_SENS = {high:.008, normal:.018, low:.04};
async function onsetStart(cb){
  const c = ac();
  await micStart(() => {});
  MIC.cb = null; clearInterval(MIC.timer); MIC.timer = 0;     // 音程の検出は使わない
  ONS.cb = cb; ONS.last = 0; ONS.prev = 0; ONS.env = 0; ONS.hist = []; ONS.floor = .003;
  if(!ONS.proc){
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 90;
    // 500Hz以下だけを通す(3段)。ギターの低音・声・手拍子は通り、クリックの高い音はほぼ消える
    const lps = [0, 1, 2].map(() => { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500; return f; });
    const proc = c.createScriptProcessor(512, 1, 1);
    const mute = c.createGain(); mute.gain.value = 0;
    MIC.src.connect(hp); hp.connect(lps[0]); lps[0].connect(lps[1]); lps[1].connect(lps[2]); lps[2].connect(proc); proc.connect(mute); mute.connect(c.destination);
    proc.onaudioprocess = onsetProcess;
    // コード判定用(周波数分析)
    const an = c.createAnalyser(); an.fftSize = 8192; an.smoothingTimeConstant = 0;
    MIC.src.connect(an);
    ONS.proc = proc; ONS.nodes = [hp, ...lps, mute, an]; ONS.an = an;
  }
}
function onsetStop(){
  ONS.cb = null;
  if(ONS.proc){ try{ ONS.proc.disconnect(); ONS.nodes.forEach(n => n.disconnect()); }catch(e){} ONS.proc = null; ONS.an = null; }
  micStop();
}
function onsetProcess(e){
  if(!ONS.cb) return;
  // 包絡線(瞬時に立ち上がり、約40msかけて下がる)を作り、約25ms前と比べて急に大きくなった瞬間を「出だし」とする
  const d = e.inputBuffer.getChannelData(0), c = AE.ctx, sr = c.sampleRate;
  const tEnd = c.currentTime, N = d.length, sub = 64;
  const rel = Math.exp(-1 / (sr * .04));
  const back = Math.max(4, Math.round(.025 * sr / sub));
  const thr0 = MIC_SENS[RS().micSens] || MIC_SENS.normal;
  const H = ONS.hist || (ONS.hist = []);
  let env = ONS.env || 0;
  for(let k = 0; k < N; k += sub){
    let pk = 0;
    for(let i = k; i < k + sub; i++){
      const a = Math.abs(d[i]);
      env = a > env ? a : env * rel;
      if(a >= env && a > pk) pk = a;
    }
    const t = tEnd - (N - k) / sr;
    H.push(env); if(H.length > back + 2) H.shift();
    const before = H.length > back ? H[H.length - 1 - back] : 0;
    ONS.level = Math.max(env, ONS.level * .985);
    const thr = Math.max(thr0, ONS.floor * 4);
    if(env > thr && env > before * 1.6 + thr0 * .5 && t - ONS.last > .075){ ONS.last = t; try{ ONS.cb(t, env); }catch(err){} }
    if(env < ONS.floor * 3 || ONS.floor < 1e-4) ONS.floor = ONS.floor * .995 + env * .005;
  }
  ONS.env = env;
}
// マイクから見た遅れ(スピーカーの遅れ+マイクの遅れ)を測る。スピーカーで鳴らした音をマイクで拾う
function thumpAt(t, dest){
  const c = AE.ctx, len = .05, buf = c.createBuffer(1, Math.floor(c.sampleRate * len), c.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
  const src = c.createBufferSource(); src.buffer = buf;
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500;
  const g = c.createGain(); g.gain.value = 1.4;
  src.connect(lp); lp.connect(g); g.connect(dest || AE.master); src.start(t);
}
let MCAL = null;
function openMicCalib(after){

  openSheet(`

    <div class="meter" style="margin-top:8px"><div class="needle" id="mcLvl" style="opacity:1;left:0;width:0;margin-left:0"></div></div>

        const hit = MCAL.on.find(o => o > t - (clap ? .15 : .01) && o < t + .45);
        if(hit !== undefined) offs.push((hit - t) * 1000);
      });
      onsetStop();

        MCAL = null; return;

      out.innerHTML = `✅ マイクの遅れを <b>${RS().micLat}</b> ms に設定しました${after ? '<br><button class="btn primary" onclick="closeSheet();(' + after + ')()">続ける</button>' : ''}`;
      MCAL = null;

  };

const inputKey = l => l && l.mic ? 'inputV' : 'input';
function inputMode(l){ const k = inputKey(l); return RS()[k] || (l && l.mic ? 'mic' : 'tap'); }

/* ---------- リズム唱(タン・タタ・タカタカ…) ---------- */
const SYLL = {q:'タン', e2:'タタ', off:'ウタ', r:'ウン', s4:'タカタカ', es:'タ タカ', se:'タカ タ', ses:'タカ ァカ', ds:'タ ーカ', so:'ウカタカ', t3:'タタタ', sw:'タッカ'};
function beatCells(hits, grid = 4){
  const out = [];
  for(let b = 0; b < 4; b++){
    const f = hits.filter(h => h >= b - 1e-6 && h < b + 1 - 1e-6).map(h => Math.round((h - b) * 12) / 12);
    const key = Object.keys(CELLS).find(k => CELLS[k].length === f.length && CELLS[k].every((x, i) => Math.abs(x - f[i]) < .02));
    out.push(key || null);
  }
  return out;
}

/* ---------- 本物の音符(リズム譜)をSVGで描く ---------- */
function rhythmNotationSVG(hits, o = {}){
  const W = o.w || 300, H = o.h || 92, x0 = 14, bw = (W - x0 - 10) / 4, y = H - 30, top = y - 34;
  const cells = beatCells(hits);
  const col = o.color || 'var(--text)';
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W * 2}px;display:block;margin:0 auto" xmlns="http://www.w3.org/2000/svg">`;
  s += `<line x1="4" x2="${W - 4}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-width="1.5"/>`;
  s += `<line x1="${W - 5}" x2="${W - 5}" y1="${y - 14}" y2="${y + 14}" stroke="var(--muted)" stroke-width="1.5"/>`;
  const head = x => `<ellipse cx="${x}" cy="${y}" rx="6.2" ry="4.6" transform="rotate(-20 ${x} ${y})" fill="${col}"/>`;
  const stem = x => `<line x1="${x + 5.4}" x2="${x + 5.4}" y1="${y - 2}" y2="${top}" stroke="${col}" stroke-width="1.6"/>`;
  const beam = (a, b, lv = 0) => `<rect x="${a + 4.6}" y="${top + lv * 6.5}" width="${b - a + 1.6}" height="4.2" fill="${col}"/>`;
  const stub = (x, dir, lv = 1) => `<rect x="${dir > 0 ? x + 4.6 : x - 4.4}" y="${top + lv * 6.5}" width="10" height="4.2" fill="${col}"/>`;
  const flag = (x, n = 1) => Array.from({length:n}, (_, i) => `<path d="M${x + 5.4} ${top + i * 7} q 10 6 6 16" fill="none" stroke="${col}" stroke-width="2.2"/>`).join('');
  const qrest = x => `<path d="M${x - 2} ${y - 16} l6 7 l-5 6 l6 7 q-7 -3 -6 4" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round"/>`;
  const erest = (x, n = 1) => Array.from({length:n}, (_, i) => `<circle cx="${x - 2 - i * 2}" cy="${y - 8 + i * 7}" r="2.6" fill="${col}"/><path d="M${x - 2 - i * 2} ${y - 8 + i * 7} q 5 1 7 -3" fill="none" stroke="${col}" stroke-width="1.6"/>`).join('') + `<line x1="${x + 5}" x2="${x - 1 - (n - 1) * 2}" y1="${y - 11}" y2="${y + 8}" stroke="${col}" stroke-width="1.6"/>`;
  const dot = x => `<circle cx="${x + 11}" cy="${y - 2}" r="2" fill="${col}"/>`;
  const three = (a, b) => `<text x="${(a + b) / 2 + 5}" y="${top - 4}" font-size="11" font-style="italic" text-anchor="middle" fill="${col}">3</text>`;
  cells.forEach((c, b) => {
    const X = x0 + b * bw, at = f => X + 6 + f * (bw - 16);
    if(c === 'q'){ s += head(at(0)) + stem(at(0)); }
    else if(c === 'r'){ s += qrest(at(.3)); }
    else if(c === 'e2'){ const a = at(0), z = at(.5); s += head(a) + stem(a) + head(z) + stem(z) + beam(a, z); }
    else if(c === 'off'){ const z = at(.5); s += erest(at(0) + 2) + head(z) + stem(z) + flag(z); }
    else if(c === 's4'){ const xs = [0, .25, .5, .75].map(at); xs.forEach(x => s += head(x) + stem(x)); s += beam(xs[0], xs[3]) + beam(xs[0], xs[3], 1); }
    else if(c === 'es'){ const xs = [0, .5, .75].map(at); xs.forEach(x => s += head(x) + stem(x)); s += beam(xs[0], xs[2]) + beam(xs[1], xs[2], 1); }
    else if(c === 'se'){ const xs = [0, .25, .5].map(at); xs.forEach(x => s += head(x) + stem(x)); s += beam(xs[0], xs[2]) + beam(xs[0], xs[1], 1); }
    else if(c === 'ses'){ const xs = [0, .25, .75].map(at); xs.forEach(x => s += head(x) + stem(x)); s += beam(xs[0], xs[2]) + stub(xs[0], 1) + stub(xs[2], -1); }
    else if(c === 'ds'){ const xs = [0, .75].map(at); xs.forEach(x => s += head(x) + stem(x)); s += dot(xs[0]) + beam(xs[0], xs[1]) + stub(xs[1], -1); }
    else if(c === 'so'){ const xs = [.25, .5, .75].map(at); s += erest(at(0) + 2, 2); xs.forEach(x => s += head(x) + stem(x)); s += beam(xs[0], xs[2]) + beam(xs[0], xs[2], 1); }
    else if(c === 't3'){ const xs = [0, 1 / 3, 2 / 3].map(f => at(f * 1.1)); xs.forEach(x => s += head(x) + stem(x)); s += beam(xs[0], xs[2]) + three(xs[0], xs[2]); }
    else if(c === 'sw'){ const a = at(0), z = at(.7); s += head(a) + stem(a) + head(z) + stem(z) + flag(z) + three(a, z); }
    else{
      // 想定外のリズムは16分のマス目で
      const f = hits.filter(h => h >= b && h < b + 1).map(h => h - b);
      f.forEach(v => { const x = at(v); s += head(x) + stem(x) + flag(x, 2); });
    }
    if(o.syll && c){ s += `<text x="${X + bw / 2}" y="${H - 6}" font-size="12" font-weight="800" text-anchor="middle" fill="var(--accent)">${SYLL[c] || ''}</text>`; }
    if(o.dirs){ hits.forEach((h, i) => { if(h >= b && h < b + 1 && o.dirs[i]){ const x = at(h - b); s += `<text x="${x + 5}" y="${top - 6}" font-size="10" text-anchor="middle" fill="${o.dirs[i] === 'U' ? '#3D8BE0' : 'var(--accent)'}">${noteGlyph(o.dirs[i])}</text>`; } }); }
  });
  return s + '</svg>';
}
const notaMode = () => RS().nota || 'grid';      // grid / note / both

/* ---------- 小節の表示(隠す・音符・リズム唱) ---------- */
function drawBarView(bar, next){

/* ---------- リズム・エコー(聴いたリズムを叩き返す) ---------- */
function startREcho(){
  const mic = inputMode(null) === 'mic';
  const E = {cleared:0, lv:1, cur:null};
  const lvOf = n => n < 3 ? 1 : n < 6 ? 2 : n < 10 ? 3 : 4;
  const bpmOf = () => Math.min(132, 80 + E.cleared * 2);
  rgStart({
    title:'👏 リズム・エコー', mode:'bar', bpm:80, lives:3, mic, nota:notaMode() !== 'grid',
    bar(i){
      if(i === 0) return {type:'count', events:[], label:'🎯 READY', bpm:bpmOf()};
      const bpm = bpmOf();
      if(i % 2 === 1){
        E.lv = lvOf(E.cleared);
        E.cur = genRhythmBar(E.lv).hits;
        return {type:'call', bpm, events:E.cur.map(b => ({b, d:'T'})), sound:true, hideNotes:true, label:`👂 聴いて(Lv${E.lv})`, hint:'👂 まずは聴いて!'};
      }
      return {type:'resp', bpm, events:E.cur.map(b => ({b, d:'T'})), judge:true, hideNotes:true, label:`👏 ${mic ? '手拍子・声・ギターで' : 'タップで'}返して!`};
    },
    sound(e, t, bus){ percAt(t, bus); },
    tapSound(inp, n, bus, t){ if(!inp.mic) percAt(t, bus, true); },
    onBarEnd(b, R){
      if(b.type !== 'resp') return;
      const ns = R.notes.filter(n => n.bar === b.i);
      const ok = ns.length && ns.every(n => n.judge !== 'M');
      b.revealed = true;
      const sub = $('#rjSub');
      if(ok){ E.cleared++; R.score += 50 * E.lv; if(sub) sub.textContent = `✨ CLEAR ${E.cleared}`; sfx('ok'); }
      else{ R.lives--; if(sub) sub.textContent = `💔 ${ns.filter(n => n.judge === 'M').length}つずれた`; sfx('ng'); if(R.lives <= 0){ R.finalBar = true; R.endTime = AE.ctx.currentTime; setTimeout(() => rgEnd(), 700); } }
      updateRHud();
    },
    onEnd(res){
      const a = state.arcade.recho || {};
      const newRec = E.cleared > (a.best || 0);
      if(newRec) state.arcade.recho = {best:E.cleared, lv:E.lv};
      const xp = 10 + E.cleared * 5;
      addXP(xp); today().done.arcade = true;
      const notices = [`👏 ${E.cleared} リズム成功(Lv${E.lv}・最高 ♩=${bpmOf()})`];
      if(newRec && a.best) notices.push(`🏆 自己ベスト更新!(前回 ${a.best})`);
      planCheck(notices); save();
      renderRResult(res, {title:'👏 リズム・エコー', xp, notices, newRec, endless:true, big:`${E.cleared}`, bigLabel:'リズム', retry:startREcho});
    },
  });
}

function openKeep(){
  const log = RS().keepLog || [], last = log[log.length - 1];
  openSheet(`
    <div class="sheet-head"><h3>⏱ テンポキープ診断</h3><button class="icon-btn" onclick="closeSheet()">✕</button></div>
    <p class="small">クリックに合わせて4分音符を叩きます。<b>3小節目からクリックが消えます</b>。そのまま同じテンポで叩き続けてください(6小節=24拍)。走る/もたるクセと、何拍キープできたかを測ります。</p>
    ${last ? `<div class="notice" style="font-weight:400;text-align:left;font-size:13px">前回(${last.d.slice(5).replace('-', '/')} ♩${last.bpm}):キープ ${last.keep}拍 ・ ${last.drift > 0 ? '+' : ''}${last.drift.toFixed(1)} BPM ・ ばらつき ±${Math.round(last.sd)}ms</div>` : ''}
    ${inputSegHTML(null, 'openKeep()')}
    <div class="small muted" style="margin:8px 0 4px">テンポを選んでスタート</div>
    <div class="row wrap">${[60,80,100,120].map(b => `<button class="bpm-chip" onclick="closeSheet();startKeep(${b})">♩${b}</button>`).join('')}</div>`);
}
function startKeep(bpm){
  const mic = inputMode(null) === 'mic';
  const CLICK = 2, SILENT = 6;
  rgStart({
    title:`⏱ テンポキープ診断 ♩=${bpm}`, mode:'bar', bpm, mic,
    bar(i){
      if(i === 0) return {type:'count', events:[], label:'🎯 クリックに合わせて準備'};
      const m = i - 1;
      if(m >= CLICK + SILENT) return null;
      const silent = m >= CLICK;
      return {type:'play', events:Q4.map(b => ({b, d:'T'})), judge:true, click:silent ? 'none' : 'all', label: silent ? `🔇 クリックなし ${m - CLICK + 1}/${SILENT} — 同じテンポで!` : `▶ クリックに合わせて ${m + 1}/${CLICK}`, silent};
    },
    sound(){},
    tapSound(inp, n, bus, t){ if(!inp.mic) percAt(t, bus, true); },
    onEnd(res){ finishKeep(res, bpm, CLICK); },
  });
}
function finishKeep(res, bpm, CLICK){
  const R = res.RG, beat = 60 / bpm;
  const silentBars = R.bars.filter(b => b.silent);
  const t0 = silentBars.length ? silentBars[0].t0 : null;
  const taps = (R.raw || []).filter(t => t0 !== null && t > t0 - beat / 2).sort((a, b) => a - b);
  // 各タップを最も近い拍に対応づけ、ずれ(ms)を出す
  const pts = [];
  taps.forEach(t => { const k = Math.round((t - t0) / beat); if(k >= 0 && k < silentBars.length * 4 && !pts.some(p => p.k === k)) pts.push({k, t, dev:(t - (t0 + k * beat)) * 1000}); });
  let drift = 0, sd = 0, keep = 0, endMs = 0;
  if(pts.length >= 4){
    const n = pts.length, mk = pts.reduce((a, p) => a + p.k, 0) / n, mt = pts.reduce((a, p) => a + p.t, 0) / n;
    const slope = pts.reduce((a, p) => a + (p.k - mk) * (p.t - mt), 0) / pts.reduce((a, p) => a + (p.k - mk) ** 2, 0);   // 実際の1拍の長さ(秒)
    drift = 60 / slope - bpm;
    endMs = (beat - slope) * (silentBars.length * 4) * 1000;        // クリックなし区間の最後までに積み重なるずれ(+ = 早くなる)
    const resid = pts.map(p => (p.t - (mt + slope * (p.k - mk))) * 1000);
    sd = Math.sqrt(resid.reduce((a, r) => a + r * r, 0) / n);
    for(let k = 0; k < silentBars.length * 4; k++){ const p = pts.find(q => q.k === k); if(!p || Math.abs(p.dev) > 80) break; keep++; }
  }
  const log = RS().keepLog || (RS().keepLog = []);
  log.push({d:todayStr(), bpm, drift:Math.round(drift * 10) / 10, sd:Math.round(sd), keep, endMs:Math.round(endMs)});
  if(log.length > 60) log.shift();
  const xp = 15 + Math.round(keep / 2);
  addXP(xp); today().done.rhythm = true;
  state.totals.keeps = (state.totals.keeps || 0) + 1;
  const notices = [];
  planCheck(notices); save();
  const verdict = Math.abs(endMs) < 40 ? '<b style="color:var(--good)">テンポが安定しています!</b>' : endMs > 0 ? `<b style="color:#4C9BEA">走り気味</b>(だんだん速くなる)。拍の「ウラ」を感じて、少しゆったり` : `<b style="color:var(--bad)">もたり気味</b>(だんだん遅くなる)。拍の頭を少し前に感じて`;
  const total = silentBars.length * 4;
  $('#v-result').innerHTML = `
    <div class="card" style="margin-top:16px">
      <p class="center small muted">⏱ テンポキープ診断 ♩=${bpm}</p>
      <div class="res-score">${keep}<span style="font-size:18px"> / ${total} 拍キープ</span></div>
      <div class="res-msg">${verdict}</div>
      <div class="stats-row" style="margin:12px 0">
        <div class="stat-box"><div class="num">${Math.round(Math.abs(endMs))}ms</div><div class="lab">最後の拍で${endMs > 0 ? '早く' : '遅く'}なった量(40ms未満が安定)</div></div>
        <div class="stat-box"><div class="num">${drift > 0 ? '+' : ''}${drift.toFixed(1)}</div><div class="lab">BPMの変化</div></div>
        <div class="stat-box"><div class="num">±${Math.round(sd)}ms</div><div class="lab">ばらつき(小さいほど安定)</div></div>
        <div class="stat-box"><div class="num">${pts.length}/${total}</div><div class="lab">クリックなしで叩けた拍</div></div>
      </div>
      <div class="res-xp"><span class="chip gold">+${xp} XP</span></div>
      ${goalLine()}
    </div>
    <div class="card"><h3>拍ごとのずれ(クリックなしの区間)</h3><canvas id="cvKeep" height="150"></canvas>
      <p class="small muted">上=早い / 下=遅い。右に行くほど上がっていれば「走り」、下がっていれば「もたり」。</p></div>
    <div class="card"><h3>これまでの記録</h3>${log.slice(-6).reverse().map(r => `<div class="vrow small"><span style="width:70px">${r.d.slice(5).replace('-', '/')}</span><span style="width:52px">♩${r.bpm}</span><span class="grow">キープ ${r.keep}拍</span><span>${r.drift > 0 ? '+' : ''}${r.drift}BPM ±${r.sd}ms</span></div>`).join('')}</div>
    <div class="row wrap" style="justify-content:center;margin:14px 0 24px">
      <button class="btn primary big" onclick="startKeep(${bpm})">もう一度</button>
      <button class="btn big" onclick="RG=null;document.body.classList.remove('in-game');setTab(currentTab)">もどる</button>
    </div>`;
  showView('result'); window.scrollTo(0, 0);
  requestAnimationFrame(() => {
    const cv = $('#cvKeep'); if(!cv || !cv.clientWidth) return;
    const [g, w, h] = setupCanvas(cv), lim = 200, cy = h / 2, sc = (h / 2 - 10) / lim;
    g.fillStyle = 'rgba(63,191,106,.12)'; g.fillRect(0, cy - 80 * sc, w, 160 * sc);
    g.strokeStyle = 'rgba(128,128,128,.6)'; g.beginPath(); g.moveTo(0, cy); g.lineTo(w, cy); g.stroke();
    const N = total;
    pts.forEach(p => { const x = (p.k + .5) / N * w, y = cy + clamp(p.dev, -lim, lim) * sc; g.fillStyle = Math.abs(p.dev) <= 40 ? '#3FBF6A' : Math.abs(p.dev) <= 80 ? '#E0A21B' : '#E5564B'; g.beginPath(); g.arc(x, y, 4, 0, 7); g.fill(); });
    g.fillStyle = 'rgba(128,128,128,.8)'; g.font = '10px sans-serif'; g.fillText('早い ↑', 4, 12); g.fillText('遅い ↓', 4, h - 4);
  });
  if(keep >= total) confetti();
}

/* ---------- コードチェンジ練習 ---------- */
const CHORDS = {
  C:{f:'x32010', pc:[0,4,7]},  G:{f:'320003', pc:[7,11,2]}, D:{f:'xx0232', pc:[2,6,9]},  A:{f:'x02220', pc:[9,1,4]},
  E:{f:'022100', pc:[4,8,11]}, Am:{f:'x02210', pc:[9,0,4]}, Em:{f:'022000', pc:[4,7,11]}, Dm:{f:'xx0231', pc:[2,5,9]},
};
const CC_SETS = [['C','G'], ['G','D'], ['D','A'], ['Am','Em'], ['C','Am'], ['Em','C'], ['G','Em'], ['A','E'], ['G','C','D'], ['C','Am','Dm','G']];
const CC_LV = [{n:8, label:'2小節ごと'}, {n:4, label:'1小節ごと'}, {n:2, label:'2拍ごと'}];
function chordSVG(name, w = 96){
  const ch = CHORDS[name]; if(!ch) return '';
  const fr = ch.f.split('').map(c => c === 'x' ? -1 : +c);
  const W = 96, H = 112, x0 = 18, sx = 13, y0 = 28, sy = 18;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${w}" xmlns="http://www.w3.org/2000/svg"><text x="${W / 2}" y="14" font-size="14" font-weight="900" text-anchor="middle" fill="var(--text)">${name}</text>`;
  s += `<rect x="${x0}" y="${y0 - 3}" width="${sx * 5}" height="4" fill="var(--text)"/>`;
  for(let i = 0; i <= 4; i++) s += `<line x1="${x0}" x2="${x0 + sx * 5}" y1="${y0 + i * sy}" y2="${y0 + i * sy}" stroke="var(--muted)"/>`;
  for(let i = 0; i < 6; i++) s += `<line x1="${x0 + i * sx}" x2="${x0 + i * sx}" y1="${y0}" y2="${y0 + 4 * sy}" stroke="var(--muted)"/>`;
  fr.forEach((f, i) => {
    const x = x0 + i * sx;
    if(f < 0) s += `<text x="${x}" y="${y0 - 7}" font-size="10" text-anchor="middle" fill="var(--muted)">×</text>`;
    else if(f === 0) s += `<circle cx="${x}" cy="${y0 - 10}" r="3.5" fill="none" stroke="var(--muted)"/>`;
    else s += `<circle cx="${x}" cy="${y0 + (f - .5) * sy}" r="5.5" fill="var(--brand)"/>`;
  });
  return s + '</svg>';
}
// マイクの周波数から「どのコードを弾いたか」を推定(練習中の候補から選ぶ)
// 周波数のピーク(山の頂点)だけを音名ごとに集計し、各コードの構成音にどれだけ集まっているかで決める
function chromaNow(){
  const an = ONS.an; if(!an) return null;
  const c = AE.ctx, bins = new Float32Array(an.frequencyBinCount);
  an.getFloatFrequencyData(bins);
  const hzPer = c.sampleRate / an.fftSize, chroma = new Array(12).fill(0);
  const lo = Math.floor(100 / hzPer), hi = Math.floor(1200 / hzPer);
  let mx = -1e9; for(let i = lo; i < hi; i++) mx = Math.max(mx, bins[i]);
  if(mx < -90) return null;
  for(let i = lo + 1; i < hi - 1; i++){
    const y = bins[i]; if(y < mx - 30 || y < bins[i - 1] || y < bins[i + 1]) continue;
    const a = bins[i - 1], b = y, cc = bins[i + 1], den = a - 2 * b + cc;
    const p = den ? (a - cc) / (2 * den) : 0;
    const m = 69 + 12 * Math.log2((i + p) * hzPer / 440);
    if(Math.abs(m - Math.round(m)) > .35) continue;
    chroma[mod(Math.round(m), 12)] += Math.pow(10, (y - mx) / 20);
  }
  return chroma;
}
function detectChord(cands){
  const ch = chromaNow(); if(!ch) return null;
  const tot = ch.reduce((a, b) => a + b, 0) || 1;
  let best = null, bs = -1;
  cands.forEach(name => { const sc = CHORDS[name].pc.reduce((a, p) => a + ch[p], 0) / tot; if(sc > bs){ bs = sc; best = name; } });
  return bs > .3 ? best : null;
}
function openChordChange(){
  const cc = RS().cc || {set:0, lv:0, bpm:70};
  const mic = inputMode(null) === 'mic';
  openSheet(`
    <div class="sheet-head"><h3>🎸 コードチェンジ練習</h3><button class="icon-btn" onclick="closeSheet()">✕</button></div>
    <p class="small">4分音符のダウンストロークで弾きながら、決めたタイミングでコードを持ち替えます。🎤マイク入力なら<b>弾いたコードも判定</b>します(目安)。</p>
    <div class="small muted" style="margin:8px 0 4px">コード</div>
    <div class="row wrap">${CC_SETS.map((s, i) => `<button class="btn sm ${cc.set === i ? 'primary' : ''}" onclick="state.rhythm.cc=Object.assign({set:0,lv:0,bpm:70},state.rhythm.cc,{set:${i}});save();openChordChange()">${s.join('→')}</button>`).join('')}</div>
    <div class="row wrap" style="justify-content:center;margin:8px 0">${CC_SETS[cc.set].map(n => chordSVG(n, 74)).join('')}</div>
    <div class="set-row"><div class="sl">持ち替えの間隔</div><div class="seg">${CC_LV.map((v, i) => `<button class="${cc.lv === i ? 'on' : ''}" onclick="state.rhythm.cc=Object.assign({set:0,lv:0,bpm:70},state.rhythm.cc,{lv:${i}});save();openChordChange()">${v.label}</button>`).join('')}</div></div>
    <div class="set-row"><div class="sl">テンポ</div><div class="seg">${[50,60,70,80,100].map(b => `<button class="${cc.bpm === b ? 'on' : ''}" onclick="state.rhythm.cc=Object.assign({set:0,lv:0,bpm:70},state.rhythm.cc,{bpm:${b}});save();openChordChange()">♩${b}</button>`).join('')}</div></div>
    ${inputSegHTML(null, 'openChordChange()')}
    ${(RS().ccLog || []).length ? `<p class="small muted">前回:持ち替え成功 ${RS().ccLog[RS().ccLog.length - 1].ok}/${RS().ccLog[RS().ccLog.length - 1].n}(${RS().ccLog[RS().ccLog.length - 1].set})</p>` : ''}
    <div class="center" style="margin-top:12px"><button class="btn primary big" onclick="closeSheet();startChordChange()">はじめる</button></div>`);
}
function startChordChange(){
  const cc = Object.assign({set:0, lv:0, bpm:70}, RS().cc);
  const set = CC_SETS[cc.set], every = CC_LV[cc.lv].n, bpm = cc.bpm;
  const mic = inputMode(null) === 'mic';
  const BARS = 8, total = BARS * 4;
  const chordAt = k => set[Math.floor(k / every) % set.length];      // k = 拍番号
  const CCs = {changes:0, ok:0, checks:[]};
  rgStart({
    title:`🎸 コードチェンジ ${set.join('→')}`, mode:'bar', bpm, mic, chords:true,
    bar(i){
      if(i === 0) return {type:'count', events:[], label:`🎯 最初は ${chordAt(0)} を押さえて`};
      const m = i - 1; if(m >= BARS) return null;
      return {type:'play', events:Q4.map(b => { const k = m * 4 + b; return {b, d:'D', chord:chordAt(k), change:k > 0 && k % every === 0}; }), judge:true, label:`▶ ${m + 1}/${BARS} 小節`};
    },
    sound(){},
    tapSound(inp, n, bus, t){ if(!inp.mic) strumAt(t, 'D', bus); },
    onJudge(n, j){
      if(!n.change) return;
      CCs.changes++;
      const timingOk = j !== 'M';
      if(!mic){ if(timingOk) CCs.ok++; return; }
      setTimeout(() => {
        const got = detectChord(set);
        const ok = timingOk && got === n.chord;
        if(ok) CCs.ok++;
        CCs.checks.push({want:n.chord, got, ok});
        const sub = $('#rjSub'); if(sub) sub.innerHTML = ok ? `✅ ${n.chord} に持ち替え成功` : `${got ? `${got} に聞こえました` : '判定できず'}(目標 ${n.chord})`;
      }, 180);    // 分析の窓(約0.17秒)が新しいコードの音で満たされてから判定
    },
    onBarStart(bar, R){
      const ev = bar.events[0];
      const cur = ev ? ev.chord : chordAt(0);
      const nx = R.bars[bar.i + 1];
      const nextCh = nx && nx.events[0] ? nx.events.find(e => e.change) : null;
      const el = $('#ccPanel');
      if(el) el.innerHTML = `<div class="cc-cur">${chordSVG(cur, 120)}</div><div class="cc-next">${(() => { const ch = bar.events.find(e => e.change) || nextCh; return ch ? `<div class="small muted">つぎ</div>${chordSVG(ch.chord, 76)}<div class="small muted">${bar.events.find(e => e.change) ? `${bar.events.find(e => e.change).b + 1}拍目で` : '次の小節'}</div>` : ''; })()}</div>`;
    },
    onEnd(res){
      const log = RS().ccLog || (RS().ccLog = []);
      log.push({d:todayStr(), set:set.join('→'), bpm, ok:CCs.ok, n:CCs.changes});
      if(log.length > 60) log.shift();
      const xp = 10 + Math.round(res.acc * 20) + CCs.ok;
      addXP(xp); today().done.rhythm = true;
      const notices = [`🎸 持ち替え成功 ${CCs.ok} / ${CCs.changes}${mic ? '(コードの判定は目安)' : '(タイミングのみ)'}`];
      if(CCs.changes && CCs.ok === CCs.changes) notices.push('🎉 すべての持ち替えが間に合いました!');
      planCheck(notices); save();
      renderRResult(res, {title:`🎸 コードチェンジ ${set.join('→')} ♩=${bpm}`, xp, notices, newRec:false, retry:startChordChange,
        next: cc.bpm < 100 ? {label:'テンポを上げて ▶', fn(){ state.rhythm.cc = Object.assign({}, cc, {bpm:[50,60,70,80,100][Math.min(4, [50,60,70,80,100].indexOf(cc.bpm) + 1)]}); save(); startChordChange(); }} : null});
    },
  });
}

      <p class="small" style="margin:6px 0">${sc.desc}</p>
      <div class="row wrap"><button class="btn sm primary" id="refPlay">▶ 上行→下行</button><button class="btn sm" id="refCad">🎼 カデンツ(${minorish ? '短調' : '長調'})</button></div>
    </div>
    <div class="card"><h3>度数カラー</h3><div class="legend">${MAJOR.map(s => `<span style="background:${DEG_COLOR[s]};color:${DEG_INK[s]}">${SOLFA[s]} ${DEGNUM[s]}</span>`).join('')}</div>

function playSpec(spec){
  ac(); stopAll();
  const [type, a, b] = spec.split(':');
  const A = +a;
  if(type === 'n') playSeq(a.split(',').map(Number), 0, 0.42);
  else if(type === 'c') chord(a.split(',').map(Number));
  else if(type === 'cad') cadence(A);
  else if(type === 'deg'){ const t = keyRef(A); resolvePath(+b).forEach((x, i) => note(A + x, t + 0.3 + i * 0.42 + (i ? 0.3 : 0))); }
  else if(type === 'int') playSeq([A, A + +b], 0, 0.8);
  else if(type === 'scale'){ const up = [...SCALES[b].iv.map(x => A + x), A + 12]; playSeq([...up, ...up.slice(0, -1).reverse()], 0, 0.3); }
  else if(type === 'melc'){ const t = keyRef(A); playSeq(b.split(',').map(x => A + +x), t + 0.3, 0.55); }
  else if(type === 'prog') playProg(A, b.split(','), 0);
}

function lvCls(k){
  const it = itemOf(k);
  if(!it.n) return ['lv0', '—'];
  const a = it.c / it.n;
  return [a >= 0.8 ? 'lv3' : a >= 0.55 ? 'lv2' : 'lv1', Math.round(a * 100) + '%'];
}
function renderStats(){
  const lv = levelInfo(state.xp), t = state.totals;
  const daysPlayed = Object.values(state.days).filter(d => d.q > 0).length;
  const rate = t.q ? Math.round(t.c / t.q * 100) : 0;
  // カレンダー(直近17週)
  const g = S().goal;
  const start = new Date(); start.setDate(start.getDate() - start.getDay() - 16 * 7);
  let cal = '';
  for(let i = 0; i < 17 * 7; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    if(d > new Date()) { cal += '<i style="visibility:hidden"></i>'; continue; }
    const k = todayStr(d), x = (state.days[k] || {}).xp || 0;
    const l = !x ? '' : x < g * 0.4 ? 'l1' : x < g ? 'l2' : x < g * 2 ? 'l3' : 'l4';
    cal += `<i class="${l}" title="${k}:${x}XP"></i>`;
  }
  // 7日棒グラフ
  const last7 = []; for(let i = -6; i <= 0; i++){ const k = dayOffset(i); last7.push({k, x:(state.days[k] || {}).xp || 0}); }
  const mx = Math.max(g, ...last7.map(x => x.x));
  const wk = ['日','月','火','水','木','金','土'];
  const bars = last7.map(o => { const d = new Date(o.k + 'T00:00'); return `<div class="bar"><span>${o.x || ''}</span><div class="${o.x >= g ? 'g' : ''}" style="height:${o.x / mx * 80}%"></div>${wk[d.getDay()]}</div>`; }).join('');
  // 度数マスタリー
  const degCells = (pref, set) => set.map(s => { const [c, p] = lvCls(pref + s); return `<div class="mcell ${c}"><b style="color:${DEG_COLOR[DEG_FAMILY[s]]}">${SOLFA[s]}</b>${p}</div>`; }).join('');
  // インターバル
  let ivh = '<div></div><div class="center muted">上行</div><div class="center muted">下行</div><div class="center muted">同時</div>';
  for(let s = 1; s <= 12; s++){
    ivh += `<div class="muted" style="padding:6px 0">${INTERVALS[s].name}</div>`;
    ['u','d','h'].forEach(d => { const [c, p] = lvCls('int:' + s + d); ivh += `<div class="mcell ${c}">${p}</div>`; });
  }
  // 指板ヒートマップ
  let fh = '<div></div>' + Array.from({length:13}, (_, f) => `<div class="center muted">${f}</div>`).join('');
  for(let s = 0; s < 6; s++){
    fh += `<div class="muted center">${STRING_NAMES[s]}</div>`;
    for(let f = 0; f <= 12; f++){ const [c, p] = lvCls('fn:' + s + '-' + f); fh += `<div class="mcell ${c}" title="${p}" style="height:24px;padding:0;display:flex;align-items:center;justify-content:center;font-size:9px">${p === '—' ? '' : p.replace('%', '')}</div>`; }
  }
  const chd = Object.keys(QUALITIES).map(q => { const [c, p] = lvCls('chd:' + q); return `<div class="mcell ${c}"><b>${QUALITIES[q].sym || 'maj'}</b>${p}</div>`; }).join('');

function rhythmStatsHTML(){
  const tiers = [];
  RTRACKS.forEach(tr => tr.lessons.forEach(l => { const t = (state.lessons[l.id] || {}).tiers; if(t) Object.values(t).forEach(x => tiers.push(x.acc)); }));
  const rate = tiers.length ? Math.round(tiers.reduce((a, b) => a + b, 0) / tiers.length * 1000) : null;
  const title = rate === null ? '—' : rate >= 950 ? 'ジャストの申し子' : rate >= 900 ? 'リズムマスター' : rate >= 800 ? 'グルーヴ職人' : rate >= 650 ? 'ビートキーパー' : rate >= 450 ? 'リズム見習い' : 'もたり見習い';
  const rec = RS().recent;
  const avg = rec.length ? rec.reduce((a, b) => a + b, 0) / rec.length : null;
  const sd = rec.length > 1 ? Math.sqrt(rec.reduce((a, b) => a + (b - avg) * (b - avg), 0) / rec.length) : null;
  const a = state.arcade;
  return `<div class="card"><h3>🥁 リズム</h3>
    <div class="stats-row">
      <div class="stat-box"><div class="num">${rate ?? '—'}</div><div class="lab">精度レート ・ ${title}</div></div>
      <div class="stat-box"><div class="num">${avg === null ? '—' : (avg > 0 ? '+' : '') + Math.round(avg) + 'ms'}</div><div class="lab">平均のズレ(${avg === null ? '' : Math.abs(avg) <= 8 ? 'ジャスト' : avg < 0 ? '走り気味' : 'もたり気味'})</div></div>
      <div class="stat-box"><div class="num">${sd === null ? '—' : '±' + Math.round(sd) + 'ms'}</div><div class="lab">ばらつき(小さいほど安定)</div></div>
    </div>
    <p class="small muted" style="margin-top:6px">直近 ${rec.length} 打の集計。タップ遅延補正 ${RS().calibMs}ms ・ 判定 ${(RDIFF[RS().diff] || RDIFF.normal).label}</p>
    <h3 style="margin-top:12px">🎮 ゲームのベスト</h3>
    <div class="stats-row">
      <div class="stat-box"><div class="num">${a.echo ? a.echo.best : 0}</div><div class="lab">🔁 エコー(フレーズ)</div></div>
      <div class="stat-box"><div class="num">${a.surv ? a.surv.best : 0}</div><div class="lab">⚡ サバイバル(小節)</div></div>
      <div class="stat-box"><div class="num">${Object.keys(a.heroClear || {}).length}/${SONGS.length}</div><div class="lab">🎹 クリアした曲</div></div>
      <div class="stat-box"><div class="num">${a.rush ? a.rush.best.toLocaleString() : 0}</div><div class="lab">🚀 音階ラッシュ(点)</div></div>

}

function voiceStatsHTML(){
  const rec = state.voice.recent;
  const hasRange = (state.voice.rangeLog || []).length;
  if(!rec.length && !hasRange) return '';
  let h = '<div class="card"><h3>🎙️ 発声の音程</h3>';
  if(rec.length){
    const avg = rec.reduce((a, b) => a + b, 0) / rec.length;

    h += `<div class="stats-row">

}


/* ---------- 週間レポート ---------- */
// 成果(★・自己ベスト・解放・実績)を日付つきで記録しておき、レポートに載せる
function logEvents(list){
  const keep = /★|🏆|✨|🔓|🎉|📏|FULL COMBO/;
  const d = todayStr();
  state.log = state.log || [];
  list.filter(x => keep.test(x)).forEach(x => state.log.push({d, s:String(x).replace(/<[^>]+>/g, '')}));
  if(state.log.length > 200) state.log = state.log.slice(-200);
}
function weekSum(from){            // from = 0 → 直近7日、-7 → その前の7日
  const w = {days:0, xp:0, q:0, c:0, vN:0, vAbs:0, rN:0, rAbs:0, rSum:0, goal:0, perDay:[]};
  for(let i = from - 6; i <= from; i++){
    const k = dayOffset(i), d = state.days[k] || {};
    if(d.q || d.xp) w.days++;
    if(d.goal) w.goal++;
    w.xp += d.xp || 0; w.q += d.q || 0; w.c += d.c || 0;
    w.vN += d.vN || 0; w.vAbs += d.vAbs || 0; w.rN += d.rN || 0; w.rAbs += d.rAbs || 0; w.rSum += d.rSum || 0;
    w.perDay.push({k, xp:d.xp || 0});
  }
  return w;
}
// 苦手の項目を読みやすい名前に
function itemLabel(k){
  const [p, v] = k.split(':');
  if(p === 'deg') return {t:`度数「${SOLFA[+v]}」の聴き取り`, l:'deg'};
  if(p === 'degm') return {t:`短調の「${SOLFA[+v]}」`, l:'deg7'};
  if(p === 'int'){ const s = parseInt(v), d = v.slice(-1); return {t:`${INTERVALS[s] ? INTERVALS[s].name : ''}(${d === 'u' ? '上行' : d === 'd' ? '下行' : '同時'})`, l:'int'}; }
  if(p === 'fn'){ const [st, f] = v.split('-'); return {t:`${+st + 1}弦${f}フレットの音名`, l:'fret'}; }
  if(p === 'ff') return {t:`「${fmtSpellPlain(spell(+v))}」を指板で探す`, l:'fret7'};
  if(p === 'fd' || p === 'fdf' || p === 'ef') return {t:`指板の度数「${SOLFA[+v]}」`, l:'fret8'};
  if(p === 'chd') return {t:`コード「${QUALITIES[v] ? QUALITIES[v].name : v}」`, l:'chd'};
  if(p === 'sn' || p === 'sf') return {t:`譜読み ${midiName(+v)}`, l:'read'};
  if(p === 'prog') return {t:`コード進行 ${v.split('-').join('–')}`, l:'chd5'};
  if(p === 'rd') return {t:'リズム聴音', l:'rr1'};
  return null;
}
function weakItems(){
  const now = Date.now();
  return Object.entries(state.items)
    .filter(([k, it]) => it.n >= 5 && now - (it.t || 0) < 21 * 864e5 && itemLabel(k))
    .map(([k, it]) => ({k, acc:it.c / it.n, n:it.n, ...itemLabel(k)}))
    .filter(x => x.acc < .8)
    .sort((a, b) => a.acc - b.acc).slice(0, 3);
}
function weekKey(){ const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return todayStr(d); }   // 今週の月曜日
function openWeekly(){
  const w = weekSum(0), p = weekSum(-7);
  state.reportSeen = weekKey(); save();
  const delta = (a, b, unit = '', better = 'up', digits = 0) => {
    if(b === null || a === null || (!b && !a)) return '';
    const d = a - b; if(Math.abs(d) < (digits ? .5 : 1)) return '<span class="dl">±0</span>';
    const good = better === 'up' ? d > 0 : d < 0;
    return `<span class="dl ${good ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'}${Math.abs(d).toFixed(digits)}${unit}</span>`;
  };
  const acc = x => x.q ? Math.round(x.c / x.q * 100) : null;
  const vAvg = x => x.vN ? x.vAbs / x.vN : null;
  const rAvg = x => x.rN ? x.rAbs / x.rN : null;
  const mx = Math.max(S().goal, ...w.perDay.map(d => d.xp));
  const wk = ['日','月','火','水','木','金','土'];
  const events = (state.log || []).filter(e => e.d >= dayOffset(-6)).slice(-8).reverse();
  const weak = weakItems();
  // ひとことコメント
  let comment;
  if(!w.days) comment = '今週はまだ練習がありません。5分だけでも始めてみましょう!';
  else if(w.days > p.days) comment = `先週より練習した日が <b>${w.days - p.days}日</b> 増えました。いい流れです!`;
  else if(vAvg(w) !== null && vAvg(p) !== null && vAvg(w) < vAvg(p) - 2) comment = `声の音程が先週より <b>${Math.round(vAvg(p) - vAvg(w))}¢</b> 正確になりました!`;
  else if(acc(w) !== null && acc(p) !== null && acc(w) > acc(p)) comment = `正答率が先週より <b>${acc(w) - acc(p)}%</b> 上がりました!`;
  else comment = `今週は <b>${w.days}日</b> 練習しました。この調子で続けましょう。`;
  const box = (num, lab, dl) => `<div class="stat-box"><div class="num">${num}</div><div class="lab">${lab}</div>${dl ? `<div class="small">${dl}</div>` : ''}</div>`;
  const sug = [];
  if(weak.length) sug.push(`<button class="btn sm primary" onclick="closeSheet();startMix()">🔀 苦手をミックスで復習</button>`);
  if(vAvg(w) === null || vAvg(w) > 25) sug.push(`<button class="btn sm" onclick="closeSheet();openVLesson('warmup')">🌅 発声ウォームアップ</button>`);
  if(rAvg(w) === null) sug.push(`<button class="btn sm" onclick="closeSheet();setTab('rhythm')">🥁 リズムレッスン</button>`);
  openSheet(`
    <div class="sheet-head"><h3>📅 週間レポート</h3><button class="icon-btn" onclick="closeSheet()">✕</button></div>
    <p class="small muted">${dayOffset(-6).slice(5).replace('-', '/')} 〜 ${dayOffset(0).slice(5).replace('-', '/')}(▲▼は前の7日との比較)</p>
    <div class="notice" style="font-weight:400;text-align:left">💬 ${comment}</div>
    <div class="stats-row" style="margin-top:8px">
      ${box(`${w.days}<span style="font-size:13px">/7日</span>`, '練習した日', delta(w.days, p.days, '日'))}
      ${box(w.xp.toLocaleString(), '獲得XP', delta(w.xp, p.xp))}
      ${box(w.q, '回答数', delta(w.q, p.q))}
      ${box(acc(w) === null ? '—' : acc(w) + '%', '正答率', delta(acc(w), acc(p), '%'))}
      ${box(vAvg(w) === null ? '—' : Math.round(vAvg(w)) + '¢', '声の音程のずれ', delta(vAvg(w), vAvg(p), '¢', 'down'))}
      ${box(rAvg(w) === null ? '—' : Math.round(rAvg(w)) + 'ms', 'リズムのずれ', delta(rAvg(w), rAvg(p), 'ms', 'down'))}
    </div>
    <h3 style="margin-top:14px">毎日のXP</h3>
    <div class="bars">${w.perDay.map(d => { const dt = new Date(d.k + 'T00:00'); return `<div class="bar"><span>${d.xp || ''}</span><div class="${d.xp >= S().goal ? 'g' : ''}" style="height:${d.xp / mx * 80}%"></div>${wk[dt.getDay()]}</div>`; }).join('')}</div>
    <p class="small muted">目標達成 ${w.goal}日 ・ 連続 ${liveStreak()}日</p>
    <h3 style="margin-top:14px">🏅 今週の成果</h3>
    ${events.length ? `<ul class="small" style="margin-left:18px">${events.map(e => `<li>${esc(e.s)} <span class="muted">${e.d.slice(5).replace('-', '/')}</span></li>`).join('')}</ul>` : '<p class="small muted">これから記録されます(★の獲得・自己ベスト・新しいレッスン解放など)。</p>'}
    <h3 style="margin-top:14px">🎯 苦手トップ3</h3>
    ${weak.length ? weak.map(x => `<div class="vrow"><span class="grow small">${esc(x.t)}</span><span class="small muted">${x.n}回</span><b class="small" style="width:44px;text-align:right;color:${x.acc < .55 ? 'var(--bad)' : 'var(--accent)'}">${Math.round(x.acc * 100)}%</b></div>`).join('')
                  : '<p class="small muted">目立った苦手はありません(5回以上出題された項目から集計)。</p>'}
    ${sug.length ? `<h3 style="margin-top:14px">💡 来週のおすすめ</h3><div class="row wrap">${sug.join('')}</div>` : ''}`);
}
function weeklyCardHTML(){
  const w = weekSum(0);
  const isNew = state.reportSeen !== weekKey() && new Date().getDay() === 1;
  return `<div class="card row" style="gap:12px${isNew ? ';border:2px solid var(--brand)' : ''}">
    <div style="font-size:30px">📅</div>
    <div class="grow"><div style="font-weight:800">週間レポート${isNew ? ' <span class="chip">NEW</span>' : ''}</div><div class="small muted">直近7日:練習 ${w.days}日 ・ ${w.xp.toLocaleString()} XP</div></div>
    <button class="btn sm ${isNew ? 'primary' : ''}" onclick="openWeekly()">見る</button></div>`;
}

/* ---------- マイクのテスト ---------- */
function micTest(){
  if(VG){ VG.alive = false; cancelAnimationFrame(VG.raf); VG = null; document.body.classList.remove('in-game'); }
  openSheet(`
    <div class="sheet-head"><h3>🎤 マイクのテスト</h3><button class="icon-btn" onclick="micStop();closeSheet()">✕</button></div>
    <p class="small">「開始」を押すと、マイクの許可を求められます。<b>「許可」</b>を押して、「ラー」と声を出してみてください。</p>
    <div class="center" style="margin:12px 0"><button class="btn primary big" id="mtGo">開始</button></div>
    <div id="mtOut" class="mic-err small" style="display:none"></div>
    <div class="meter" style="margin-top:10px"><div class="needle" id="mtLvl" style="opacity:1;left:0;width:0;margin-left:0;transition:width .05s"></div></div>
    <div class="center" style="font-size:28px;font-weight:900;margin:10px 0" id="mtNote">—</div>
    <p class="small muted center">バーが動き、音名が表示されればマイクは正常です。</p>`);
  $('#mtGo').onclick = async () => {
    const out = $('#mtOut');
    try{
      await micStart(m => {
        const n = $('#mtNote'); if(!n){ micStop(); return; }
        n.textContent = m === null ? '…' : `${fmtSpellPlain(spell(Math.round(m)), 'abc')}${Math.floor(Math.round(m) / 12) - 1}(${Math.round((m - Math.round(m)) * 100)}¢)`;
        const d = MIC.buf; let r = 0; for(let i = 0; i < d.length; i++) r += d[i] * d[i];
        $('#mtLvl').style.width = Math.min(100, Math.sqrt(r / d.length) * 600) + '%';
      });
      out.style.display = 'block'; out.innerHTML = '✅ マイクが使えます。声を出してください。';
      $('#mtGo').textContent = '再開始';
    }catch(e){
      out.style.display = 'block'; out.innerHTML = micErrorHTML(e);
      $('#mtGo').textContent = 'もう一度試す';
    }
  };
}

      <div class="set-row"><div class="sl">正解したら自動で次へ</div><input type="checkbox" id="setAuto" ${s.autoNext ? 'checked' : ''}></div>
      <div class="set-row"><div class="sl">1日の目標</div>${seg('goal', [['30','気軽 30'],['60','標準 60'],['100','本気 100'],['150','鬼 150']])}</div>
      <div class="set-row"><div class="sl">テーマ</div>${seg('theme', [['auto','自動'],['light','ライト'],['dark','ダーク']])}</div>
    </div>
    <div class="card">
      <h3>🥁 リズム</h3>
      <div class="set-row"><div class="sl">判定のきびしさ</div><div class="seg">${Object.entries(RDIFF).map(([k, v]) => `<button data-rset="diff" data-v="${k}" class="${RS().diff === k ? 'on' : ''}">${v.label}</button>`).join('')}</div></div>
      <div class="set-row"><div class="sl">タップ遅延の補正<small>現在 ${RS().calibMs}ms ${RS().calibrated ? '' : '(未調整)'}</small></div><button class="btn sm" onclick="openCalib()">🎚️ 調整する</button></div>
      <div class="set-row"><div class="sl">マイク入力の遅れ<small>${RS().micCal ? RS().micLat + 'ms' : '未測定'}(ギター・手拍子・声で判定するとき)</small></div><button class="btn sm" onclick="openMicCalib()">🎤 測る</button></div>
      <div class="set-row"><div class="sl">マイクの感度<small>反応しにくいときは「高」、雑音を拾うときは「低」</small></div><div class="seg">${[['high','高'],['normal','標準'],['low','低']].map(([k, t]) => `<button class="${RS().micSens === k ? 'on' : ''}" onclick="state.rhythm.micSens='${k}';save();renderSettings()">${t}</button>`).join('')}</div></div>
      <div class="set-row"><div class="sl">リズム譜の表示</div><div class="seg">${[['grid','マス目'],['note','音符'],['both','両方']].map(([k, t]) => `<button class="${(RS().nota || 'grid') === k ? 'on' : ''}" onclick="state.rhythm.nota='${k}';save();renderSettings()">${t}</button>`).join('')}</div></div>
      <div class="set-row"><div class="sl">ストロークのダウン/アップ判定<small>画面の左=ダウン、右=アップ</small></div><input type="checkbox" id="setDU" ${RS().du ? 'checked' : ''}></div>
      <div class="set-row"><div class="sl">ノーツの落下速度<small>ソルフェ・ヒーロー/エコー</small></div><div class="seg">${[[0.75,'ゆっくり'],[1,'ふつう'],[1.35,'速い']].map(([v, t]) => `<button data-rset="speed" data-v="${v}" class="${RS().speed == v ? 'on' : ''}">${t}</button>`).join('')}</div></div>
    </div>
    <div class="card">
      <h3>データ</h3>
      <p class="small muted">進捗はこのブラウザ内に保存されています。機種変更やブラウザ変更の前にバックアップしてください。</p>
      <div class="row wrap" style="margin-top:8px">
        <button class="btn sm" id="bkOut">⬇ バックアップを書き出す</button>
        <label class="btn sm">⬆ 読み込む<input type="file" accept=".json,application/json" id="bkIn" hidden></label>
        <button class="btn sm" id="bkReset" style="color:var(--bad)">リセット</button>
      </div>
    </div>
    <div class="card small">
      <h3>このアプリについて</h3>
      <p>ソルフェ道場は「移動ド」で音の役割を聴き取る力(相対音感)とギターのリズム感を、指板・楽譜と結びつけて鍛える個人用トレーナーです。リズムの判定エンジンは Strum Master を統合したものです。</p>
      <p class="muted" style="margin-top:6px">音源:ナイロン弦・スチール弦 = <a href="https://github.com/gleitz/midi-js-soundfonts" style="color:var(--brand)">FluidR3_GM</a>(CC BY 3.0)、ピアノ = Musyng Kite(CC BY-SA 3.0)。いずれも gleitz/midi-js-soundfonts 経由。</p>
      <p class="muted" style="margin-top:6px">旧バージョン:<a href="classic.html" style="color:var(--brand)">耳トレ classic</a> ・ キーボード:1〜9で回答/スペースで再生/Enterで次へ</p>
    </div>`;
  $$('#v-set [data-set]').forEach(b => b.onclick = () => {
    const k = b.dataset.set; let v = b.dataset.v;
    if(k === 'goal' || k === 'tempo') v = +v;
    state.settings[k] = v;
    if(k === 'theme') applyTheme();
    if(k === 'timbre'){ ac(); stopAll(); loadInstrument(v).then(() => chord([48, 52, 55, 60])); }
    if(k === 'ref'){ ac(); stopAll(); keyRef(48); }
    save(); renderSettings();
  });
  $('#setVol').oninput = e => { state.settings.volume = +e.target.value; setVolume(+e.target.value); save(); };
  $('#setVol').onchange = () => { ac(); stopAll(); note(60, 0); };
  $('#setSfx').onchange = e => { state.settings.sfx = e.target.checked; save(); };
  $$('#v-set [data-rset]').forEach(b => b.onclick = () => { const k = b.dataset.rset; state.rhythm[k] = k === 'speed' ? +b.dataset.v : b.dataset.v; save(); renderSettings(); });
  $('#setDU').onchange = e => { state.rhythm.du = e.target.checked; save(); };
  $('#setAuto').onchange = e => { state.settings.autoNext = e.target.checked; save(); };
  $('#bkOut').onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 1)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `solfa-dojo-backup-${todayStr()}.json`; document.body.appendChild(a); a.click(); a.remove();
  };
  $('#bkIn').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const d = JSON.parse(rd.result);
        if(typeof d !== 'object' || !('xp' in d)) throw new Error('bad');
        if(!confirm('現在の進捗を上書きして読み込みます。よろしいですか?')) return;
        localStorage.setItem(SAVE_KEY, JSON.stringify(d)); load(); applyTheme(); toast('読み込みました'); setTab('home');
      }catch(err){ alert('このファイルは読み込めませんでした。'); }
    };
    rd.readAsText(f);
  };
  $('#bkReset').onclick = () => {
    if(!confirm('すべての進捗を消去します。元に戻せません。よろしいですか?')) return;
    const keep = state.settings;
    localStorage.removeItem(SAVE_KEY); load(); state.settings = keep; save(); toast('リセットしました'); setTab('home');
  };
}
function applyTheme(){
  const t = S().theme;
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.querySelector('meta[name=theme-color]').content = dark ? '#131518' : '#0F6E56';
}

/* ---------- シート(モーダル) ---------- */
function openSheet(html){
  $('#sheet').innerHTML = html;
  $('#modal').classList.remove('hidden');
  $('#sheet').scrollTop = 0;
}
function closeSheet(){
  $('#modal').classList.add('hidden');
  if(!VG && !(round && round.q && round.q.mic) && MIC.stream) micStop();
}

/* =====================================================================
   イベント・起動
   ===================================================================== */
$$('.tabbar button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
$('#modal').addEventListener('click', e => { if(e.target.id === 'modal') closeSheet(); });
$('#sheet').addEventListener('click', e => { const b = e.target.closest('[data-play]'); if(b) playSpec(b.dataset.play); });
$('#gQuit').onclick = () => {
  if(round && round.mode !== 'ta' && round.i > 0 && !confirm('ラウンドをやめますか?(獲得したXPは保存されます)')) return;
  quitRound();
};
$('#gNext').onclick = goNext;
document.addEventListener('keydown', e => {
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(calib && (e.code === 'Space' || e.code === 'KeyF' || e.code === 'KeyJ')){ e.preventDefault(); if(!e.repeat) calibTap(); return; }
  if(RU && !RU.ended && $('#v-rush').classList.contains('active')){
    if(e.repeat) return;
    if(e.key === 'Escape'){ rushQuit(); return; }
    if(e.code === 'Space'){ e.preventDefault(); if(RU.q && !RU.q.answered){ stopAll(); note(RU.q.midi, 0, .6, 1.2); } return; }
    if(e.key === 'k' || e.key === 'K'){ if(RU.q && !RU.q.answered){ stopAll(); keyRef(RU.tonic); } return; }
    if(/^[1-9]$/.test(e.key)){ const b = $$('#ruBtns button')[+e.key - 1]; if(b){ e.preventDefault(); rushAnswer(+b.dataset.v, b); } }
    return;
  }
  if(VG && $('#v-vplay').classList.contains('active')){ if(e.key === 'Escape') vQuit(); return; }
  if(RG && !RG.ended && $('#v-rplay').classList.contains('active')){
    if(e.repeat) return;
    if(e.key === 'Escape'){ $('#rpQuit').click(); return; }
    if(RG.cfg.mode === 'lanes'){
      const k = '1234567'.indexOf(e.key) >= 0 ? '1234567'.indexOf(e.key) : 'asdfghj'.indexOf(e.key.toLowerCase());
      if(k >= 0 && k < RG.cfg.lanes.length && !RG.cfg.lanes[k].off){ e.preventDefault(); const b = $$('#laneBtns button')[k]; if(b){ b.classList.add('down'); setTimeout(() => b.classList.remove('down'), 110); } rgTap({lane:k}); }
      return;
    }
    const map = {Space:null, KeyF:'D', KeyJ:'U', ArrowLeft:'D', ArrowRight:'U'};
    if(e.code in map){ e.preventDefault(); rgTap({dir: RG.cfg.du ? (map[e.code] || 'D') : null}); }
    return;
  }
  if(!$('#modal').classList.contains('hidden')){ if(e.key === 'Escape') closeSheet(); return; }
  if(!round || !$('#v-game').classList.contains('active')) return;
  if(e.key === 'Escape'){ $('#gQuit').click(); return; }
  if(e.key === 'Enter'){
    if(round.answered && round.mode !== 'ta'){ e.preventDefault(); goNext(); }
    return;
  }
  if(e.key === ' '){ e.preventDefault(); const b = $('#gReplay button'); if(b) b.click(); return; }
  if(/^[1-9]$/.test(e.key)){
    const bs = $$('#gAnswer .answers .btn');
    const b = bs[+e.key - 1];
    if(b && !b.disabled) b.click();
  }
  if(e.key === 'Backspace'){ const b = $('#seqBack'); if(b) b.click(); }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);

load();
applyTheme();
setTab('home');
if('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
checkAch();
</script>
</body>
</html>
