        }else playSeq(notes, 0.15, gap);
      },
      keys: semis.map(s => pref + s),
      tonic, guitarAns:true,
    };
  },

  /* ---- インターバル ---- */
  interval(p){
    const d = p.harmonic ? 'h' : p.dir === 'both' ? pick(['u','d']) : (p.dir || 'u');
    const semi = pickWeighted(p.set, s => 'int:' + s + d);
    const lo = 45 + ri(76 - 45 - semi + 1), hi = lo + semi;
    const seq = d === 'd' ? [hi, lo] : [lo, hi];
    const iv = INTERVALS[semi];
    const playIt = () => { stopAll(); if(d === 'h'){ note(lo, 0); note(hi, 0); } else playSeq(seq, 0, 0.85); };
    return {
      kind:'choice',
      prompt: d === 'h' ? '同時に鳴った2音の音程は?' : `${d === 'u' ? '上がる ↗' : '下がる ↘'} 2音の音程は?`,
      play: playIt,
      replays: d === 'h' ? [{label:'🎵 分けて聴く', fn(){ stopAll(); playSeq([lo, hi], 0, 0.8); }}] : [],
      options: p.set.slice().sort((a, b) => a - b).map(s => ({value:String(s), html:`${INTERVALS[s].name}<small>${INTERVALS[s].short}</small>`})),
      correct: String(semi),
      explain: `${iv.name}(半音${semi}個)`,
      hint: `覚え方:${iv.song}`,
      after(){ setTimeout(playIt, 150); },
      keys:['int:' + semi + d],
    };
  },

  /* ---- 旋律聴音 ---- */
  dictation(p){
    const minor = !!p.minor, tonic = keyTonic(p.key), kpc = mod(tonic, 12);
    const offs = genMelody(p.pool, p.len, p.leap || 2, p.start);
    const notes = offs.map(o => tonic + o);
    const gap = 0.62;
    return {
      kind:'seq',
      prompt: `<span class="key">キー ${keyName(kpc, minor)}</span>${p.len}音のメロディを書き取ろう`,
      play(){ stopAll(); const t = keyRef(tonic, minor); playSeq(notes, t + 0.1, gap); },
      replays:[
        {label:'🔁 メロディだけ', fn(){ stopAll(); playSeq(notes, 0, gap); }},
        {label:'🐢 ゆっくり', fn(){ stopAll(); playSeq(notes, 0, 1.05); }},
        {label:'🎼 キー', fn(){ stopAll(); keyRef(tonic, minor); }},
      ],
      options: degOpts(p.pool),
      correct: offs.map(o => String(mod(o, 12))),
      given: 1,
      explain: offs.map(o => degPlain(o)).join(' '),
      after(){ stopAll(); playSeq(notes, 0.15, gap); },
      keys:['mel:' + (minor ? 'm' : '') + p.len],
      tonic, guitarAns:true,
    };
  },

  /* ---- 指板:音名 ---- */
  fretName(p){
    const cands = [];
    p.strings.forEach(s => { for(let f = 0; f <= p.fmax; f++){
      const m = TUNING[s] + f;
      if(p.nat && !NAT_PCS.includes(mod(m, 12))) continue;
      cands.push({s, f, midi:m});
    }});
    const c = pickWeighted(cands, x => 'fn:' + x.s + '-' + x.f);
    const pc = mod(c.midi, 12);
    return {
      kind:'choice',
      prompt: `<b>${c.s + 1}弦 ${c.f}フレット</b>の音名は?`,
      play(){},
      noAutoPlay:true,
      replays:[],
      fret:{fmin:0, fmax:p.fmax, hl:[c.s], dots:[{s:c.s, f:c.f, label:'?', color:'var(--accent)', pulse:true}], readonly:true,
            reveal:[{s:c.s, f:c.f, label:fmtSpellPlain(spell(pc), 'abc'), color:'var(--brand)'}]},
      options: nameOpts(p.nat ? NAT_PCS : CHROMA),
      correct:String(pc),
      explain:`${c.s + 1}弦${c.f}F = ${fmtSpellPlain(spell(pc))}${DEFAULT_FLAT[pc] !== undefined ? ` / ${fmtSpellPlain(spell(pc, !DEFAULT_FLAT[pc]))}` : ''}`,
      hint: c.f >= 12 ? '12フレット = 開放弦と同じ音名' : c.f === 5 ? '5フレット = 次の弦の開放と同じ音(3弦は4F)' : '',
      after(){ stopAll(); note(c.midi, 0.05); },
      keys:['fn:' + c.s + '-' + c.f],
    };
  },
  fretFind(p){
    const pc = pickWeighted(p.nat ? NAT_PCS : CHROMA, x => 'ff:' + x);
    const s = pick(p.strings);
    const ans = fretPositions(pc, 0, p.fmax, false).filter(x => x.s === s);
    return {
      kind:'fret',
      prompt: `<b>${fmtSpell(spell(pc))}</b> を <b>${s + 1}弦(${STRING_NAMES[s]})</b>で押そう`,
      play(){}, noAutoPlay:true, replays:[],
      fret:{fmin:0, fmax:p.fmax, hl:[s], dots:[], check:(ss, f, m) => ss === s && mod(m, 12) === pc,
            reveal: ans.map(x => ({s:x.s, f:x.f, label:fmtSpellPlain(spell(pc), 'abc'), color:'var(--good)'}))},
      explain: `${fmtSpellPlain(spell(pc))} は ${posTxt(ans)}`,
      keys:['ff:' + pc],
    };
  },
  fretDegree(){
    const kpc = ri(12), box = makeBox(kpc);
    const cand = box.spots.filter(x => x.semi !== 0);
    const t = pickWeighted(cand, x => 'fd:' + x.semi);
    const tonic = 48 + kpc;
    return {
      kind:'choice',
      prompt: `<span class="key">キー ${keyName(kpc)}</span> <b style="color:var(--accent)">?</b> の音は何度?`,
      play(){}, noAutoPlay:true, replays:[{label:'🎼 キー', fn(){ stopAll(); keyRef(tonic); }}],
      fret:{fmin:box.fmin, fmax:box.fmax, readonly:true,
            dots:[...rootDots(box), {s:t.s, f:t.f, label:'?', color:'var(--accent)', pulse:true}],
            reveal:[{s:t.s, f:t.f, label:SOLFA[t.semi], color:DEG_COLOR[t.semi], ink:DEG_INK[t.semi]}]},
      options: degOpts(MAJOR),
      correct:String(t.semi),
      explain:`${degPlain(t.semi)}(${nm(t.midi, keyFlat(kpc))})`,
      hint:`赤いドからの距離:半音${t.semi}個`,
      after(){ stopAll(); const r = box.spots.find(x => x.semi === 0); if(r) note(r.midi, 0.05); note(t.midi, 0.55); },
      keys:['fd:' + t.semi],
    };
  },
  fretDegreeFind(){
    const kpc = ri(12), box = makeBox(kpc);
    const semi = pickWeighted(MAJOR.filter(s => s), s => 'fdf:' + s);
    const ans = box.spots.filter(x => x.semi === semi);
    const tonic = 48 + kpc;
    return {
      kind:'fret',
      prompt: `<span class="key">キー ${keyName(kpc)}</span> 「<b style="color:${DEG_COLOR[semi]}">${degLabel(semi)}</b>」をこの範囲で1つ押そう`,
      play(){}, noAutoPlay:true, replays:[{label:'🎼 キー', fn(){ stopAll(); keyRef(tonic); }}],
      fret:{fmin:box.fmin, fmax:box.fmax, dots:rootDots(box),
            check:(s, f, m) => mod(m - kpc, 12) === semi,
            reveal: ans.map(x => ({s:x.s, f:x.f, label:SOLFA[semi], color:DEG_COLOR[semi], ink:DEG_INK[semi]}))},
      explain:`${degPlain(semi)} = ${nm(kpc + semi, keyFlat(kpc))}:${posTxt(ans)}`,
      keys:['fdf:' + semi],
    };
  },
  earFret(){
    const kpc = ri(12), box = makeBox(kpc);
    const t = pickWeighted(box.spots, x => 'ef:' + x.semi);
    const tonic = 48 + kpc;
    const ans = box.spots.filter(x => x.semi === t.semi);
    return {
      kind:'fret',
      prompt: `<span class="key">キー ${keyName(kpc)}</span> 聴こえた音を指板で押そう`,
      play(){ stopAll(); const e = keyRef(tonic); note(t.midi, e + 0.1); },
      replays:[{label:'🔁 音だけ', fn(){ stopAll(); note(t.midi, 0); }}, {label:'🎼 キー', fn(){ stopAll(); keyRef(tonic); }}],
      fret:{fmin:box.fmin, fmax:box.fmax, dots:rootDots(box),
            check:(s, f, m) => mod(m - kpc, 12) === t.semi,
            reveal: ans.map(x => ({s:x.s, f:x.f, label:SOLFA[t.semi], color:DEG_COLOR[t.semi], ink:DEG_INK[t.semi]}))},
      explain:`${degPlain(t.semi)}(${nm(t.midi, keyFlat(kpc))})`,
      hint:DEG_CHAR[t.semi],
      after(){ stopAll(); const base = t.midi - t.semi; resolvePath(t.semi).forEach((x, i) => note(base + x, 0.1 + i * 0.36)); },
      keys:['ef:' + t.semi],
    };
  },

  /* ---- 和音 ---- */
  chordQ(p){
    const q = pickWeighted(p.q, x => 'chd:' + x);
    const root = 48 + ri(10);
    const ms = QUALITIES[q].iv.map(x => root + x);
    const block = () => { stopAll(); chord([root - 12, ...ms]); };
    const arp = () => { stopAll(); playSeq(ms, 0, 0.32); };
    return {
      kind:'choice',
      prompt:'このコードの種類は?',
      play: block,
      replays:[{label:'🎸 アルペジオ', fn:arp}],
      options: p.q.map(x => ({value:x, html:`${QUALITIES[x].name}<small>${QUALITIES[x].sym || 'maj'}</small>`})),
      correct:q,
      explain:`${QUALITIES[q].name}(例:${fmtSpellPlain(spell(root), 'abc')}${QUALITIES[q].sym})`,
      after(){ block(); setTimeout(arp, 1300); },
      keys:['chd:' + q],
    };
  },
  progChoice(p){
    const prog = pickWeighted(p.pool, x => 'prog:' + x.join('-'));
    const tonic = 45 + ri(10);
    const others = shuffle(p.pool.filter(x => x.join('-') !== prog.join('-'))).slice(0, 3);
    const opts = shuffle([prog, ...others]);
    const playIt = () => { stopAll(); chord(triadOf(tonic + 12, 'maj')); playProg(tonic, prog, 1.5); };
    return {
      kind:'choice',
      prompt:'最初にキーの I。続く4コードの進行は?',
      play: playIt,
      replays:[{label:'🔁 進行だけ', fn(){ stopAll(); playProg(tonic, prog, 0); }}],
      options: opts.map(x => ({value:x.join('-'), html:x.join(' – ')})),
      correct: prog.join('-'),
      explain: prog.join(' – ') + `(キー${keyName(mod(tonic, 12))}:${prog.map(r => chordSym(tonic, r)).join(' ')})`,
      after(){ stopAll(); playProg(tonic, prog, 0.1); },
      keys:['prog:' + prog.join('-')],
    };
  },
  progSeq(p){
    const prog = pickWeighted(p.pool.filter(x => x.every(r => p.chords.includes(r))), x => 'prog:' + x.join('-'));
    const tonic = 45 + ri(10);
    return {
      kind:'seq',
      prompt:'最初にキーの I。4つのコードをディグリーで書き取ろう',
      play(){ stopAll(); chord(triadOf(tonic + 12, 'maj')); playProg(tonic, prog, 1.5); },
      replays:[{label:'🔁 進行だけ', fn(){ stopAll(); playProg(tonic, prog, 0); }},
               {label:'🐢 ゆっくり', fn(){ stopAll(); playProg(tonic, prog, 0, 1.8); }}],
      options: p.chords.map(r => ({value:r, html:r, color:ROMAN_COLOR[r]})),
      correct: prog.slice(),
      given: 1,
      explain: prog.join(' – ') + `(キー${keyName(mod(tonic, 12))}:${prog.map(r => chordSym(tonic, r)).join(' ')})`,
      after(){ stopAll(); playProg(tonic, prog, 0.1); },
      keys:['prog:' + prog.join('-')],
    };
  },

  /* ---- 譜読み ---- */
  staffName(p){
    const cands = [];
    for(let m = p.lo; m <= p.hi; m++) if(p.acc || NAT_PCS.includes(mod(m, 12))) cands.push(m);
    const w = pickWeighted(cands, m => 'sn:' + m);
    const pc = mod(w, 12);
    const sp = spell(w, Math.random() < 0.5);
    const pos = fretPositions(w - 12, 0, 12);
    return {
      kind:'choice',
      prompt:'この音符の音名は?',
      play(){}, noAutoPlay:true, replays:[],
      staff:[{midi:w, sp}],
      options: p.acc ? CHROMA.map(x => ({value:String(x), html: NAT_PCS.includes(x) ? fmtSpell(spell(x), 'abc') : `${fmtSpell(spell(x, false), 'abc')}/${fmtSpell(spell(x, true), 'abc')}`}))
                     : NAT_PCS.map(x => ({value:String(x), html:fmtSpell(spell(x))})),
      correct:String(pc),
      explain:`${fmtSpellPlain(sp)} — ギターでは ${posTxt(pos.slice(0, 3)) || '(範囲外)'}`,
      after(){ stopAll(); note(w - 12, 0.05); },
      keys:['sn:' + w],
    };
  },
  staffFret(p){
    const cands = [];
    for(let m = p.lo; m <= p.hi; m++){
      if(!NAT_PCS.includes(mod(m, 12)) && !p.acc) continue;
      if(fretPositions(m - 12, 0, p.fmax).length) cands.push(m);
    }
    const w = pickWeighted(cands, m => 'sf:' + m);
    const sp = spell(w, Math.random() < 0.5);
    const ans = fretPositions(w - 12, 0, p.fmax);
    return {
      kind:'fret',
      prompt:'この音符をギターで押そう(同じ高さならどこでもOK)',
      play(){}, noAutoPlay:true, replays:[],
      staff:[{midi:w, sp}],
      fret:{fmin:0, fmax:p.fmax, dots:[], check:(s, f, m) => m === w - 12,
            reveal: ans.map(x => ({s:x.s, f:x.f, label:sp.L + sp.acc, color:'var(--good)'}))},
      explain:`${fmtSpellPlain(sp)} = ${posTxt(ans)}`,
      keys:['sf:' + w],
    };
  },

  /* ---- 視唱・弾き返し ---- */
  sing(p){
    const tonic = 48 + voiceKpc(), kpc = mod(tonic, 12);
    const offs = p.pool ? genMelody(p.pool, p.len, 2, 'tonic') : [pickWeighted(p.set, s => 'sing:' + s)];
    const ms = offs.map(o => tonic + o);
    return {
      kind:'mic',
      prompt: `<span class="key">キー ${keyName(kpc)}</span>${offs.length > 1 ? 'フレーズを順に歌おう' : '表示された音を歌おう'}`,
      play(){ stopAll(); keyRef(tonic); },
      replays:[{label:'🎼 キー', fn(){ stopAll(); keyRef(tonic); }}, {label:'🔴 ドの音', fn(){ stopAll(); note(tonic, 0); }}],
      mic:{tonic, offs, ms, show:true},
      explain: offs.map(o => degPlain(o)).join(' '),
      after(){ stopAll(); playSeq(ms, 0.1, 0.6); },
      keys:['sing:' + (offs.length > 1 ? 'L' + offs.length : offs[0])],
    };
  },
  echo(p){
    const tonic = 48 + voiceKpc(), kpc = mod(tonic, 12);
    const offs = p.pool ? genMelody(p.pool, p.len, 2, 'tonic') : [pickWeighted(p.set, s => 'echo:' + s)];
    const ms = offs.map(o => tonic + o);
    return {
      kind:'mic',
      prompt: `<span class="key">キー ${keyName(kpc)}</span>聴こえた${offs.length > 1 ? 'フレーズ' : '音'}をギターで弾き返そう`,
      play(){ stopAll(); const t = keyRef(tonic); playSeq(ms, t + 0.1, 0.65); },
      replays:[{label:'🔁 もう一度', fn(){ stopAll(); playSeq(ms, 0, 0.65); }}, {label:'🎼 キー', fn(){ stopAll(); keyRef(tonic); }}],
      mic:{tonic, offs, ms, show:false},
      explain: offs.map(o => `${degPlain(o)}(${nm(tonic + o, keyFlat(kpc))})`).join(' '),
      after(){ stopAll(); playSeq(ms, 0.1, 0.6); },
      keys:['echo:' + (offs.length > 1 ? 'L' + offs.length : offs[0])],
    };
  },
};
function chordSym(tonic, r){
  const [semi, q] = ROMANS[r];
  return fmtSpellPlain(spell(tonic + semi, keyFlat(mod(tonic, 12))), 'abc') + QUALITIES[q].sym;
}
function playProg(tonic, prog, when = 0, step = 1.05){
  prog.forEach((r, i) => {
    const [semi, q] = ROMANS[r];
    let root = tonic + semi; if(root > tonic + 7) root -= 12;
    chord(triadOf(root + 12, q).map(x => x), when + i * step * tempo(), 0.3);
  });
}

/* =====================================================================
   指板(SVG)
   ===================================================================== */
function renderFretboard(el, o){
  const fmin = o.fmin || 0, fmax = o.fmax;
  const avail = Math.max(280, (el.clientWidth || el.parentElement.clientWidth || 340) - 4);
  const labelW = 22, openW = fmin === 0 ? 34 : 0;
  const first = Math.max(1, fmin), nF = fmax - first + 1;
  const fw = clamp((avail - labelW - openW - 6) / nF, 40, 92);
  const top = 14, sp = 30, H = top * 2 + sp * 5 + 20;
  const W = labelW + openW + fw * nF + 8;
  const x0 = labelW + openW;                        // 最初のフレット線(ナット)の位置
  const cx = f => f === 0 ? labelW + openW / 2 - 2 : x0 + (f - first + 0.5) * fw;
  const sy = s => top + s * sp;
  let h = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  h += `<rect x="${x0}" y="${top - 10}" width="${fw * nF}" height="${sp * 5 + 20}" rx="4" fill="var(--wood)"/>`;
  // ポジションマーク
  for(let f = first; f <= fmax; f++){
    const m = f % 12;
    if([3,5,7,9].includes(m) || (m === 0 && f > 0)){
      if(m === 0){
        h += `<circle cx="${cx(f)}" cy="${sy(1.5)}" r="5" fill="var(--wood2)"/><circle cx="${cx(f)}" cy="${sy(3.5)}" r="5" fill="var(--wood2)"/>`;
      }else h += `<circle cx="${cx(f)}" cy="${sy(2.5)}" r="5" fill="var(--wood2)"/>`;
    }
  }
  // フレット線
  for(let f = first; f <= fmax + 1; f++){
    const x = x0 + (f - first) * fw;
    const isNut = f === 1 && fmin <= 1;
    h += `<line x1="${x}" y1="${top - 10}" x2="${x}" y2="${top + sp * 5 + 10}" stroke="${isNut ? 'var(--nut)' : 'var(--fretc)'}" stroke-width="${isNut ? 5 : 2}"/>`;
  }
  // 弦
  const hl = new Set(o.hl || []);
  for(let s = 0; s < 6; s++){
    const y = sy(s);
    h += `<line x1="${fmin === 0 ? labelW : x0}" y1="${y}" x2="${W - 8}" y2="${y}" stroke="${hl.has(s) ? 'var(--accent)' : 'var(--stringc)'}" stroke-width="${(hl.has(s) ? 1.5 : 0.8) + s * 0.35}" opacity="${o.hl && o.hl.length && !hl.has(s) ? .45 : 1}"/>`;
    h += `<text x="4" y="${y + 4}" font-size="11" fill="${hl.has(s) ? 'var(--accent)' : 'var(--muted)'}" font-weight="${hl.has(s) ? 800 : 400}">${STRING_NAMES[s]}</text>`;
  }
  // フレット番号
  for(let f = fmin; f <= fmax; f++){
    h += `<text x="${cx(f)}" y="${H - 3}" font-size="11" text-anchor="middle" fill="var(--muted)">${f}</text>`;
  }
  // タップ領域
  if(!o.readonly){
    for(let s = 0; s < 6; s++) for(let f = fmin; f <= fmax; f++){
      const x = f === 0 ? labelW - 4 : x0 + (f - first) * fw;
      const w = f === 0 ? openW + 2 : fw;
      h += `<rect class="fb-cell" data-s="${s}" data-f="${f}" x="${x}" y="${sy(s) - sp / 2}" width="${w}" height="${sp}" fill="transparent"/>`;
    }
  }
  // ドット
  (o.dots || []).forEach(d => {
    if(d.f < fmin || d.f > fmax) return;
    const lab = String(d.label ?? '');
    const fs = lab.length > 2 ? 9 : 12;
    h += `<g class="fb-dot${d.pulse ? ' pulse' : ''}"><circle cx="${cx(d.f)}" cy="${sy(d.s)}" r="${d.r || 12}" fill="${d.color || 'var(--brand)'}" ${d.ring ? 'stroke="var(--text)" stroke-width="2.5"' : ''} opacity="${d.op ?? 1}"/>`
       + `<text x="${cx(d.f)}" y="${sy(d.s) + fs / 2 - 1}" font-size="${fs}" text-anchor="middle" fill="${d.ink || '#fff'}">${esc(lab)}</text></g>`;
  });
  h += '</svg>';
  el.innerHTML = h;
  if(o.onTap && !o.readonly){
    el.querySelector('svg').addEventListener('click', e => {
      const c = e.target.closest('.fb-cell'); if(!c) return;
      const s = +c.dataset.s, f = +c.dataset.f;
      o.onTap(s, f, TUNING[s] + f);
    });
  }
  // 見せたい位置へスクロール
  const focus = (o.dots || [])[0];
  if(focus && W > avail) el.scrollLeft = Math.max(0, cx(focus.f) - avail / 2);
}

/* =====================================================================
   五線譜(SVG)。ト音記号・ギター用(記譜音で表示)
   ===================================================================== */
function renderStaff(el, notes){
  const W = 230, H = 170, ls = 12, bottom = 112;       // 第1線(E4)の y
  const stepOf = sp => {
    const oct = Math.floor(sp.midi / 12) - 1;
    return oct * 7 + LETTERS.indexOf(sp.L);
  };
  const yOf = st => bottom - (st - 30) * (ls / 2);     // E4 = 4*7+2 = 30
  let h = `<svg width="${W * 1.25}" height="${H * 1.25}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  for(let i = 0; i < 5; i++){ const y = bottom - i * ls; h += `<line x1="12" x2="${W - 12}" y1="${y}" y2="${y}" stroke="var(--text)" stroke-width="1.2"/>`; }
  h += `<text x="14" y="${bottom + 20}" font-size="104" fill="var(--text)" font-family="'Apple Symbols','Noto Music','Segoe UI Symbol',serif">𝄞</text>`;
  h += `<text x="30" y="${bottom + 36}" font-size="11" fill="var(--muted)" font-style="italic">8</text>`;
  notes.forEach((n, i) => {
    const st = stepOf({midi:n.midi, L:n.sp.L});
    const x = 140 + i * 40, y = yOf(st);
    for(let s = 28; s >= st; s -= 2) h += `<line x1="${x - 15}" x2="${x + 15}" y1="${yOf(s)}" y2="${yOf(s)}" stroke="var(--text)" stroke-width="1.2"/>`;
    for(let s = 40; s <= st; s += 2) h += `<line x1="${x - 15}" x2="${x + 15}" y1="${yOf(s)}" y2="${yOf(s)}" stroke="var(--text)" stroke-width="1.2"/>`;
    h += `<ellipse cx="${x}" cy="${y}" rx="7.6" ry="5.6" transform="rotate(-20 ${x} ${y})" fill="var(--text)"/>`;
    if(st < 34) h += `<line x1="${x + 7}" x2="${x + 7}" y1="${y}" y2="${y - 36}" stroke="var(--text)" stroke-width="1.4"/>`;
    else h += `<line x1="${x - 7}" x2="${x - 7}" y1="${y}" y2="${y + 36}" stroke="var(--text)" stroke-width="1.4"/>`;
    if(n.sp.acc) h += `<text x="${x - 26}" y="${y + 7}" font-size="21" fill="var(--text)">${n.sp.acc}</text>`;
  });
  h += '</svg>';
  el.innerHTML = h;
}

/* =====================================================================
   ラウンド進行
   ===================================================================== */
let round = null;
const QN = 10;

function startLesson(id){
  const l = LESSONS[id];
  beginRound({mode:'lesson', lesson:l, title:`${l.track.icon} ${l.track.name} ${l.idx + 1}:${l.t}`, total:QN, gens:[{gen:l.gen, p:l.p}]});
}
function startMix(){
  const pool = mixPool();
  beginRound({mode:'mix', title:'🔀 デイリーミックス', total:QN, gens:pool});
}
function startTA(key){
  const m = TA_MODES[key];
  beginRound({mode:'ta', taKey:key, title:`⏱️ 60秒チャレンジ:${m.name}`, total:999, gens:[{gen:m.gen, p:m.p, ctx:m.ctx}]});
}
// 解放済みレッスンから、成績が低い・最近やっていないものを優先して集める
function mixPool(){
  const cands = [];
  TRACKS.forEach(tr => tr.lessons.forEach(l => {
    if(tr.id === 'sing' || tr.id === 'voice' || tr.id === 'kids') return;
    const ls = state.lessons[l.id];
    if(!ls || !ls.plays) return;
    const acc = ls.best / QN;
    const days = ls.last ? (Date.now() - ls.last) / 864e5 : 5;
    cands.push({l, w: 0.5 + (1 - acc) * 2 + Math.min(days, 7) * 0.3});
  }));
  if(!cands.length) return [{gen:'degree', p:LESSONS.deg1.p}, {gen:'fretName', p:LESSONS.fret1.p}, {gen:'interval', p:LESSONS.int1.p}];
  const chosen = [];
  const bag = cands.slice();
  while(chosen.length < 4 && bag.length){
    let r = Math.random() * bag.reduce((a, b) => a + b.w, 0);
    let i = 0; for(; i < bag.length - 1; i++){ r -= bag[i].w; if(r <= 0) break; }
    chosen.push(bag.splice(i, 1)[0].l);
  }
  return chosen.map(l => ({gen:l.gen, p:l.p, from:l}));
}
function beginRound(cfg){
  ac();
  round = Object.assign(cfg, {i:0, score:0, combo:0, maxCombo:0, xp:0, answered:false, q:null, misses:[], hinted:false, startedAt:Date.now()});
  document.body.classList.add('in-game');
  showView('game');
  const rec = SMP[S().timbre];
  if(rec && !rec.done){
    // 初回だけ音源の読み込みを待つ(最大8秒。間に合わなければシンセで補う)
    $('#gTitle').textContent = cfg.title;
    $('#gPrompt').innerHTML = '🎸 音源を読み込み中…<br><span class="small muted">初回のみ。次回からはすぐ始まります</span>';
    $('#gVisual').innerHTML = $('#gReplay').innerHTML = $('#gAnswer').innerHTML = '';
    $('#gInfo').textContent = '';
    const me = round;
    Promise.race([rec.promise, new Promise(r => setTimeout(r, 8000))]).then(() => { if(round === me) beginRoundReady(cfg); });
    return;
  }
  beginRoundReady(cfg);
}
function beginRoundReady(cfg){
  if(cfg.mode === 'ta'){
    round.endAt = 0;
    const m = TA_MODES[cfg.taKey];
    $('#gTitle').textContent = cfg.title;
    $('#gPrompt').innerHTML = `60秒で何問正解できるか挑戦!<br><span class="small muted">間違えても続行。${m.intro ? '最初にキーCのドレミファソラシドが鳴ります。' : ''}</span>`;
    $('#gVisual').innerHTML = '';
    $('#gReplay').innerHTML = '';
    $('#gAnswer').innerHTML = `<div class="center" style="margin:20px 0"><button class="btn primary big" id="taGo">スタート</button></div>`;
    $('#gProg').style.width = '100%';
    $('#gInfo').textContent = '60s';
    $('#taGo').onclick = () => {
      let delay = 0;
      if(m.intro){ stopAll(); delay = keyRef(48) * 1000; }
      $('#taGo').disabled = true;
      setTimeout(() => {
        round.endAt = Date.now() + 60000;
        round.timer = setInterval(taTick, 200);
        nextQ();
      }, delay);
    };
    return;
  }
  nextQ();
}
function taTick(){
  if(!round || round.mode !== 'ta') return;
  const left = Math.max(0, round.endAt - Date.now());
  $('#gInfo').textContent = Math.ceil(left / 1000) + 's';
  $('#gProg').style.width = (left / 600) + '%';
  if(left <= 0){ clearInterval(round.timer); endRound(); }
}
function nextQ(){
  const r = round;
  r.answered = false; r.hinted = false; r.seq = null;
  hideFb();
  micPause(); droneStop();
  const g = pick(r.gens);
  r.q = GEN[g.gen](g.p, g.ctx || {});
  r.q.from = g.from;
  const q = r.q;
  if(r.mode !== 'ta'){
    $('#gProg').style.width = (r.i / r.total * 100) + '%';
    $('#gInfo').textContent = r.combo >= 3 ? `🔥${r.combo}` : `${r.i + 1}/${r.total}`;
  }
  $('#gTitle').textContent = r.mode === 'mix' && g.from ? `${r.title} ・ ${g.from.track.icon}${g.from.t}` : r.title;
  $('#gPrompt').innerHTML = q.prompt;
  const vis = $('#gVisual');
  vis.innerHTML = '';
  if(q.staff){ const d = document.createElement('div'); d.className = 'staff-wrap'; vis.appendChild(d); renderStaff(d, q.staff); }
  // もう一度ボタン類
  const rp = $('#gReplay'); rp.innerHTML = '';
  if(!q.noAutoPlay){
    const b = document.createElement('button'); b.className = 'btn sm'; b.innerHTML = '🔊 もう一度';
    b.onclick = () => q.play(); rp.appendChild(b);
  }
  (q.replays || []).forEach(x => {
    const b = document.createElement('button'); b.className = 'btn sm'; b.innerHTML = x.label;
    b.onclick = x.fn; rp.appendChild(b);
  });
  renderAnswer(q);
  if(!q.noAutoPlay) setTimeout(() => { if(round && round.q === q) q.play(); }, 280);
}

/* ---------- 回答UI ---------- */
function renderAnswer(q){
  const area = $('#gAnswer'); area.innerHTML = '';
  if(q.fret){
    const fb = document.createElement('div'); fb.className = 'fb-wrap'; fb.id = 'gFret';
    area.appendChild(fb);
    q.fret.onTap = (s, f, m) => fretTap(s, f, m);
    renderFretboard(fb, q.fret);
  }
  if(q.kind === 'choice' || q.kind === 'seq'){
    if(q.kind === 'seq'){
      const slots = document.createElement('div'); slots.className = 'slots'; slots.id = 'gSlots';
      area.appendChild(slots);
      round.seq = q.correct.slice(0, q.given || 0);
      drawSlots();
    }
    const wrap = document.createElement('div');
    const isDeg = q.options.some(o => o.color);
    wrap.className = 'answers' + (isDeg ? ' deg' : '') + (q.optClass ? ' ' + q.optClass : '');
    q.options.forEach((o, i) => {
      const b = document.createElement('button');
      b.className = 'btn';
      b.dataset.value = o.value;
      b.innerHTML = o.html + (i < 9 && matchMedia('(hover:hover)').matches ? `<span class="kbd">${i + 1}</span>` : '');
      if(o.color){ b.style.background = o.color; b.style.borderColor = o.color; b.style.color = o.ink || '#fff'; }
      b.onclick = () => q.kind === 'choice' ? answerChoice(o.value, b) : seqInput(o.value);
      wrap.appendChild(b);
    });
    area.appendChild(wrap);
    if(q.kind === 'seq'){
      const ctl = document.createElement('div'); ctl.className = 'row'; ctl.style.marginTop = '8px';
      ctl.innerHTML = `<button class="btn sm" id="seqBack">⌫ 1つ消す</button><button class="btn sm" id="seqClear">やり直す</button>`;
      area.appendChild(ctl);
      $('#seqBack').onclick = () => { if(round.answered) return; if(round.seq.length > (q.given || 0)) round.seq.pop(); drawSlots(); };
      $('#seqClear').onclick = () => { if(round.answered) return; round.seq = q.correct.slice(0, q.given || 0); drawSlots(); };
    }
  }
  if(q.kind === 'mic') renderMic(q, area);
  if(q.guitarAns) gaSetup(q, area);
}
function optOf(q, v){ return q.options.find(o => o.value === v) || {html:v}; }
function drawSlots(results){
  const q = round.q, el = $('#gSlots'); if(!el) return;
  const n = q.correct.length;
  let h = '';
  for(let i = 0; i < n; i++){
    const v = round.seq[i];
    const cls = ['slot'];
    let style = '';
    if(v !== undefined){
      const o = optOf(q, v);
      cls.push(i < (q.given || 0) ? 'given' : 'filled');
      if(o.color) style = `background:${o.color};border-color:${o.color};color:${o.ink || '#fff'}`;
      else style = 'background:var(--brand);border-color:var(--brand);color:#fff';
    }else if(i === round.seq.length) cls.push('cur');
    if(results) cls.push(results[i] ? 'ok' : 'ng');
    h += `<div class="${cls.join(' ')}" style="${style}">${v !== undefined ? optOf(q, v).html.replace(/<small>.*<\/small>/, '') : ''}</div>`;
    if(i < n - 1) h += '<span class="slot-arrow">›</span>';
  }
  el.innerHTML = h;
}
function seqInput(v){
  const r = round; if(r.answered) return;
  r.seq.push(v);
  drawSlots();
  if(r.seq.length >= r.q.correct.length){
    r.answered = true;
    const res = r.q.correct.map((c, i) => c === r.seq[i]);
    const ok = res.every(Boolean);
    drawSlots(res);
    lockAnswers();
    const partial = res.filter(Boolean).length - (r.q.given || 0);
    finish(ok, ok ? '' : `(${partial}/${r.q.correct.length - (r.q.given || 0)} 正解)`);
  }
}
function lockAnswers(){ $$('#gAnswer .answers .btn').forEach(b => b.disabled = true); }
function answerChoice(v, btn){
  const r = round; if(r.answered) return;
  r.answered = true;
  const ok = v === r.q.correct;
  $$('#gAnswer .answers .btn').forEach(b => {
    b.disabled = true;
    if(b.dataset.value === r.q.correct) b.classList.add('correct');
    else if(b === btn) b.classList.add('wrong');
    else b.style.opacity = .5;
  });
  if(r.q.fret && r.q.fret.reveal){
    renderFretboard($('#gFret'), Object.assign({}, r.q.fret, {dots:[...(r.q.fret.dots || []).filter(d => !d.pulse), ...r.q.fret.reveal], readonly:true}));
  }
  finish(ok);
}
function fretTap(s, f, m){
  const r = round; if(r.answered || !r.q.fret.check) return;
  note(m, 0, 0.5);
  r.answered = true;
  const ok = r.q.fret.check(s, f, m);
  const dots = [...(r.q.fret.dots || []), ...r.q.fret.reveal];
  if(!ok) dots.push({s, f, label:'✕', color:'var(--bad)'});
  else dots.push({s, f, label:'✓', color:'var(--good)', ring:true});
  renderFretboard($('#gFret'), Object.assign({}, r.q.fret, {dots, readonly:true}));
  const q = r.q;
  finish(ok, '', true);
  if(q.after) setTimeout(() => { if(round && round.q === q) q.after(ok); }, 650);
}

/* ---------- ギターで答える(度数聴音・旋律聴音) ---------- */
// 弾いた音をマイクで聴き取り、キーのドからの度数に直して、ボタンを押したのと同じ扱いにする
const GA = {cand:null, cnt:0, armed:true, lastPc:null, silence:0};
function gaSetup(q, area){
  const on = !!state.settings.guitarAns;
  const bar = document.createElement('div');
  bar.className = 'ga-bar';
  bar.innerHTML = `<button class="btn sm ${on ? 'primary' : ''}" id="gaToggle">🎸 ギターで答える${on ? ':ON' : ''}</button><span id="gaNow" class="small muted">${on ? '🎸 準備中…' : 'ONにすると、弾いた音で回答できます'}</span>`;
  area.prepend(bar);
  $('#gaToggle').onclick = () => {
    state.settings.guitarAns = !state.settings.guitarAns; save();
    if(!state.settings.guitarAns) micPause();
    const nb = $('#gaToggle').parentElement; nb.remove(); gaSetup(q, $('#gAnswer'));
  };
  if(!on) return;
  Object.assign(GA, {cand:null, cnt:0, armed:true, lastPc:null, silence:0});
  micStart(gaFrame).then(() => { const el = $('#gaNow'); if(el) el.textContent = '🎸 弾いてください(単音で)'; })
    .catch(err => { const el = $('#gaNow'); if(el) el.innerHTML = micErrorHTML(err); });
}
function gaFrame(midi, why){
  const r = round; if(!r || r.answered || !r.q || !r.q.guitarAns) return;
  const el = $('#gaNow');
  if(midi === null){
    GA.silence += 45; GA.cand = null; GA.cnt = 0;
    if(GA.silence > 140) GA.armed = true;       // 音が切れたら、同じ音をもう一度弾いても受け付ける
    if(el && GA.silence > 400) el.textContent = why === 'busy' ? '🔈 再生中…' : '🎸 弾いてください(単音で)';
    return;
  }
  GA.silence = 0;
  const near = Math.round(midi);
  if(Math.abs(midi - near) > .4){ GA.cnt = 0; return; }
  const pc = mod(near - r.q.tonic, 12);
  if(GA.cand === pc) GA.cnt++; else { GA.cand = pc; GA.cnt = 1; }
  if(el) el.innerHTML = `いま:<b style="color:${DEG_COLOR[pc]}">${SOLFA[pc]}</b>(${midiName(near)})`;
  if(GA.cnt >= 5 && (GA.armed || GA.lastPc !== pc)){
    GA.armed = false; GA.lastPc = pc; GA.cnt = 0;
    const v = String(pc);
    if(!r.q.options.some(o => o.value === v)){ if(el) el.innerHTML = `<b>${SOLFA[pc]}</b> は選択肢にありません`; return; }
    if(r.q.kind === 'choice') answerChoice(v, $(`#gAnswer .answers .btn[data-value="${v}"]`));
    else seqInput(v);
  }
}

/* ---------- マイク回答 ---------- */
function renderMic(q, area){
  const m = q.mic;
  const box = document.createElement('div'); box.className = 'mic-box';
  box.innerHTML = `
    <div class="mic-targets" id="micT"></div>
    <div class="meter"><div class="zone"></div><div class="center"></div><div class="needle" id="micN"></div></div>
    <div class="mic-hold"><div id="micH"></div></div>
    <div class="mic-read"><span id="micNow">🎤 準備中…</span><span id="micCents"></span></div>`;
  area.appendChild(box);
  const ctl = document.createElement('div'); ctl.className = 'row wrap'; ctl.style.marginTop = '6px';
  ctl.innerHTML = `<button class="btn sm" id="micDrone">🎵 ドローン</button><button class="btn sm" id="micHint">💡 お手本(ヒント)</button><button class="btn sm" id="micGive">🏳 できなかった</button>`;
  area.appendChild(ctl);
  round.mic = {idx:0, hold:0, lastT:0};
  drawMicTargets();
  $('#micDrone').onclick = () => { if(AE.drone) droneStop(); else droneStart(m.tonic); $('#micDrone').classList.toggle('primary', !!AE.drone); };
  $('#micHint').onclick = () => { round.hinted = true; stopAll(); const i = round.mic.idx; note(m.ms[i], 0); $('#micHint').textContent = '💡 ヒント使用'; };
  $('#micGive').onclick = () => { if(round.answered) return; round.answered = true; micPause(); droneStop(); finish(false); };
  micStart(micFrame).catch(err => micFallback(q, err));
}
function drawMicTargets(){
  const q = round.q, m = q.mic, st = round.mic;
  $('#micT').innerHTML = m.offs.map((o, i) => {
    const s = mod(o, 12);
    const visible = m.show || i < st.idx;
    const cls = 'mic-t' + (i === st.idx ? ' cur' : '') + (i < st.idx ? ' hit' : '');
    const bg = visible ? DEG_COLOR[s] : 'var(--faint)';
    return `<div class="${cls}" style="background:${bg};color:${visible ? DEG_INK[s] : '#fff'}">${visible ? SOLFA[s] : '?'}${visible ? `<small>${DEGNUM[s]}</small>` : ''}</div>`;
  }).join('');
}
function micFrame(midi, why){
  const r = round; if(!r || r.answered || !r.q.mic) return;
  const m = r.q.mic, st = r.mic;
  const needle = $('#micN'), now = $('#micNow'), cents = $('#micCents'), hold = $('#micH');
  if(!needle) return;
  const t = performance.now();
  const dt = st.lastT ? t - st.lastT : 0; st.lastT = t;
  if(midi === null){
    needle.style.opacity = 0;
    now.textContent = why === 'busy' ? '🔈 再生中…' : '🎤 声(音)を出してください';
    cents.textContent = '';
    st.hold = Math.max(0, st.hold - dt * 2); hold.style.width = (st.hold / 380 * 100) + '%';
    return;
  }
  const target = m.ms[st.idx];
  let diff = midi - target;
  diff = diff - 12 * Math.round(diff / 12);               // オクターブは無視
  const semiFromTonic = Math.round(midi - m.tonic);
  now.innerHTML = `いま:<b>${SOLFA[mod(semiFromTonic, 12)]}</b> ${fmtSpellPlain(spell(Math.round(midi)), 'abc')}`;
  cents.textContent = (diff > 0 ? '+' : '') + Math.round(diff * 100) + ' cent';
  needle.style.opacity = 1;
  needle.style.left = clamp(50 + diff * 50, 2, 98) + '%';   // ±1半音 = 端から端
  if(Math.abs(diff) < 0.45){ st.hold += dt; needle.style.background = 'var(--good)'; }
  else { st.hold = Math.max(0, st.hold - dt); needle.style.background = 'var(--accent)'; }
  hold.style.width = Math.min(100, st.hold / 380 * 100) + '%';
  if(st.hold >= 380){
    st.hold = 0; st.idx++;
    sfx('ok');
    drawMicTargets();
    if(st.idx >= m.ms.length){
      r.answered = true; micPause(); droneStop();
      if(!r.hinted) state.totals.mic++;
      finish(!r.hinted, r.hinted ? '(ヒント使用のため不正解扱い)' : '');
    }
  }
}
// マイクが使えない環境:自己採点
function micFallback(q, err){
  const area = $('#gAnswer');
  area.querySelector('.mic-box').innerHTML = `
    <div class="mic-targets" id="micT"></div>
    <div class="mic-err small">${micErrorHTML(err)}</div>
    <div class="row wrap" style="margin-top:8px"><button class="btn" id="micRetry">🎤 もう一度試す</button></div>
    <p class="small muted" style="margin-top:8px">マイクなしで続ける場合は<b>自己採点モード</b>:歌う(弾く)→「答え合わせ」でお手本を聴いて、合っていたか自分で判定してください。</p>
    <div class="row wrap" style="margin-top:8px"><button class="btn primary" id="selfCheck">🔊 答え合わせ</button></div>
    <div class="row wrap hidden" id="selfJudge" style="margin-top:8px"><button class="btn" id="selfOk">⭕ 合っていた</button><button class="btn" id="selfNg">❌ ずれていた</button></div>`;
  round.mic.idx = q.mic.show ? 0 : 0;
  drawMicTargets();
  $('#micHint').classList.add('hidden');
  $('#micRetry').onclick = () => { if(round.answered) return; renderAnswer(q); };
  $('#selfCheck').onclick = () => { stopAll(); playSeq(q.mic.ms, 0, 0.6); $('#selfJudge').classList.remove('hidden'); round.mic.idx = q.mic.ms.length; drawMicTargets(); };
  $('#selfOk').onclick = () => { if(round.answered) return; round.answered = true; finish(true, '(自己採点)', true); };
  $('#selfNg').onclick = () => { if(round.answered) return; round.answered = true; finish(false, '(自己採点)', true); };
}

/* ---------- 回答後の共通処理 ---------- */
function finish(ok, extra = '', noAfter = false){
  const r = round, q = r.q;
  const ta = r.mode === 'ta';
  (q.keys || []).forEach(k => recordItem(k, ok));
  state.totals.q++;
  const d = today(); d.q++;
  const h = new Date().getHours();
  if(h < 7 && h >= 4) state.totals.early = 1;
  if(h >= 23 || h < 3) state.totals.night = 1;
  let gained = 0;
  if(ok){
    r.score++; r.combo++; r.maxCombo = Math.max(r.maxCombo, r.combo);
    state.totals.c++; d.c++;
    gained = ta ? 4 : 10 + Math.min(r.combo - 1, 10);
    if(r.combo > 0 && r.combo % 5 === 0 && !ta) comboPop(r.combo);
  }else{
    r.combo = 0;
    r.misses.push(q);
  }
  state.totals.maxCombo = Math.max(state.totals.maxCombo, r.combo);
  addXP(gained);
  r.xp += gained;
  touchStreak();
  sfx(ok ? 'ok' : 'ng');
  save();
  if(ta){
    $('#gInfo').textContent = Math.ceil(Math.max(0, r.endAt - Date.now()) / 1000) + 's';
    showFb(ok, q, extra);
    setTimeout(() => { if(round === r && Date.now() < r.endAt) nextQ(); }, ok ? 350 : 1100);
    return;
  }
  $('#gInfo').textContent = r.combo >= 3 ? `🔥${r.combo}` : `${r.i + 1}/${r.total}`;
  $('#gProg').style.width = ((r.i + 1) / r.total * 100) + '%';
  if(q.after && !noAfter) q.after(ok);
  showFb(ok, q, extra);
  if(ok && S().autoNext && q.kind !== 'mic'){
    r.autoT = setTimeout(() => { if(round === r && r.answered) goNext(); }, q.kind === 'seq' ? 2600 : 1900);
  }
}
function showFb(ok, q, extra){
  const fb = $('#gFb');
  fb.className = 'g-fb show ' + (ok ? 'ok' : 'ng');
  const praise = ['正解!', 'いいね!', 'その調子!', 'ナイス!', 'お見事!'];
  $('#gFbText').innerHTML = ok
    ? `<b>⭕ ${pick(praise)}</b> ${esc(q.explain || '')} ${extra}`
    : `<b>✕ 正解:</b> ${esc(q.explain || '')} ${extra}${q.hint ? `<span class="ex">${esc(q.hint)}</span>` : ''}`;
  $('#gNext').style.display = round.mode === 'ta' ? 'none' : '';
  $('#gNext').textContent = round.i + 1 >= round.total ? '結果を見る' : '次へ';
}

/* ---------- XP・ストリーク ---------- */
function addXP(n){
  if(!n) return;
  const before = levelInfo(state.xp).lv;
  state.xp += n;
  const d = today();
  const wasGoal = d.xp >= S().goal;
  d.xp += n;
  if(!wasGoal && d.xp >= S().goal){
    d.goal = true; state.totals.goalDays++;
    toast(`🎯 今日の目標 ${S().goal}XP 達成!`);
    confetti();
  }
  const after = levelInfo(state.xp);
  if(after.lv > before){
    toast(`⬆️ レベル${after.lv}!「${after.title}」`);
    sfx('lv'); confetti();
  }
  updateHeader();
}
function touchStreak(){
  const t = todayStr(), st = state.streak;
  if(st.last === t) return;
  const y = dayOffset(-1), y2 = dayOffset(-2);
  if(st.last === y) st.count++;
  else if(st.last === y2 && st.freezes > 0){ st.freezes--; st.used.push(y); st.count++; toast('🧊 おやすみチケットで連続記録を守りました'); }
  else st.count = 1;
  st.last = t;
  st.best = Math.max(st.best, st.count);
  if(st.count > 0 && st.count % 7 === 0 && st.freezes < 2){ st.freezes++; toast('🧊 7日連続ボーナス:おやすみチケット +1'); }
  if(st.count >= 2) toast(`🔥 ${st.count}日連続!`);
  updateHeader();
}
function checkAch(){
  const got = [];
  ACH.forEach(a => {
    if(state.ach[a.id]) return;
    try{ if(a.f()){ state.ach[a.id] = todayStr(); got.push(a); } }catch(e){}
  });
  got.forEach((a, i) => setTimeout(() => toast(`🏅 実績解除:${a.i} ${a.n}`), 400 + i * 700));
  if(got.length){ state.log = state.log || []; got.forEach(a => state.log.push({d:todayStr(), s:`🏅 実績「${a.n}」`})); }
  if(got.length) save();
  return got;
}

function endRound(){
  const r = round;
  clearInterval(r.timer); clearTimeout(r.autoT);
  micStop(); droneStop(); hideFb();
  state.totals.rounds++;
  const d = today();
  const notices = [];
  let bonus = 0, stars = 0;
  if(r.mode === 'lesson'){
    const ls = state.lessons[r.lesson.id] || (state.lessons[r.lesson.id] = {best:0, stars:0, plays:0, last:0});
    stars = r.score >= 10 ? 3 : r.score >= 9 ? 2 : r.score >= 7 ? 1 : 0;
    const wasPassed = ls.stars >= 1;
    ls.plays++; ls.last = Date.now();
    if(r.score > ls.best) ls.best = r.score;
    if(stars > ls.stars){ if(ls.stars) notices.push(`★${stars} に更新!`); ls.stars = stars; }
    bonus += 15;
    if(stars && !wasPassed){
      const nx = r.lesson.track.lessons[r.lesson.idx + 1];
      if(nx) notices.push(`🔓 次のレッスン解放:${nx.t}`);
      else notices.push(`🏆 ${r.lesson.track.name} 全レッスン突破!`);
    }

  }else if(r.mode === 'mix'){
    bonus += 20;
    d.done.mix = true;
  }else if(r.mode === 'ta'){
    const prev = state.ta[r.taKey] || 0;

  }
  if(r.mode !== 'ta' && r.score === r.total){ state.totals.perfect++; bonus += 25; }
  planCheck(notices);
  addXP(bonus);
  r.xp += bonus;
  save();
  const achs = checkAch();
  renderResult(r, stars, notices, achs);
  if(stars === 3 || (r.mode !== 'ta' && r.score === r.total)) confetti();
}

   リズム:音
   ===================================================================== */
// 絶対時刻 t(AudioContext 秒)に1音。dest を省略すると master
function noteAt(midi, t, vol = 0.55, dur = 1, dest, inst){
  const c = ac(); if(!c) return;
  try{
    const id = inst || (S().timbre === 'synth' ? 'nylon' : S().timbre);
    const sm = sampleFor(id, midi);
    const src = c.createBufferSource(), g = c.createGain();
    if(sm){
      src.buffer = sm.buf; src.playbackRate.value = sm.rate;
      const rel = t + Math.max(0.12, dur);
      g.gain.setValueAtTime(vol * 1.1, t);
      g.gain.setTargetAtTime(0, rel, 0.12);
      src.start(t); src.stop(rel + 0.9);
    }else{
      src.buffer = ksBuf(midi); g.gain.value = vol; src.start(t); src.stop(t + dur + 0.6);
    }
    src.connect(g); g.connect(dest || AE.master);
    if(!dest) track(src, t + dur);
  }catch(e){}
}
function clickAt(t, accent, dest, hi){
  const c = AE.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = 'sine'; o.frequency.value = hi ? (accent ? 3136 : 2637) : (accent ? 1568 : 1047);   // マイク入力時は高い音(マイク側で除去しやすい)
  // 2msでなめらかに立ち上げる(急な立ち上がりの「プチッ」という広い帯域の雑音を出さない → マイクが拾わない)
  g.gain.setValueAtTime(.0001, t);
  g.gain.linearRampToValueAtTime(accent ? .42 : .26, t + .002);
  g.gain.exponentialRampToValueAtTime(.001, t + .05);
  o.connect(g); g.connect(dest || AE.master); o.start(t); o.stop(t + .06);
  if(!dest) track(o, t + .06);
}
// ウッドブロック風の打撃音(拍感レッスン・リズム聴音用)
function percAt(t, dest, hi){
  const c = AE.ctx, o = c.createOscillator(), g = c.createGain(), bp = c.createBiquadFilter();
  o.type = 'triangle'; o.frequency.setValueAtTime(hi ? 1250 : 880, t); o.frequency.exponentialRampToValueAtTime(hi ? 900 : 620, t + .08);
  g.gain.setValueAtTime(.55, t); g.gain.exponentialRampToValueAtTime(.001, t + .12);
  bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 1.2;
  o.connect(bp); bp.connect(g); g.connect(dest || AE.master); o.start(t); o.stop(t + .14);
  if(!dest) track(o, t + .14);
}
function muteAt(t, dest){
  const c = AE.ctx, len = .07, buf = c.createBuffer(1, Math.floor(c.sampleRate * len), c.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
  const src = c.createBufferSource(); src.buffer = buf;
  const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1600; bp.Q.value = .8;
  const g = c.createGain(); g.gain.value = .6;
  src.connect(bp); bp.connect(g); g.connect(dest || AE.master); src.start(t);
}
const STRUM_CHORD = [40, 47, 52, 56, 59, 64];      // E メジャー(開放)
function strumAt(t, dir, dest){
  if(dir === 'X'){ muteAt(t, dest); return; }
  const seq = dir === 'U' ? STRUM_CHORD.slice(2).reverse() : STRUM_CHORD;
  const inst = S().timbre === 'steel' ? 'steel' : 'nylon';
  seq.forEach((m, i) => noteAt(m, t + i * .009, dir === 'U' ? .2 : .24, .32, dest, inst));
}

/* =====================================================================
   リズム:エンジン(Strum Master の判定ロジックを汎用化)
   cfg = {title, mode:'bar'|'lanes', bpm, bar(i, RG) → 小節 | null, sound(e, t, bus),
          tapSound(input, note, bus), lanes?, du?, lives?, onJudge?, onBarEnd?, onEnd(result)}
   小節 = {type, events:[{b, d?, lane?, midi?}], sound?, judge?, click?, bpm?, swing?, label}
   ===================================================================== */
const RDIFF = {
  easy:  {label:'やさしい', p:50, g:90, o:140, miss:180},
  normal:{label:'標準',     p:35, g:70, o:110, miss:150},
  hard:  {label:'シビア',   p:25, g:50, o:90,  miss:135},
};
const RS = () => state.rhythm;
let RG = null;
const JTXT = {P:'PERFECT', G:'GREAT', O:'GOOD', M:'MISS', X:'空振り'};
const JCOL = {P:'#3FBF6A', G:'#4C9BEA', O:'#E0A21B', M:'#E5564B'};

function rgStart(cfg){
  const c = ac(); if(!c) return;
  stopAll(); micStop(); droneStop();
  if(RG) rgStop();
  RG = {cfg, bars:[], notes:[], counts:{P:0, G:0, O:0, M:0}, extra:0, score:0, combo:0, maxCombo:0,
        lives:cfg.lives || null, ended:false, diff:RDIFF[RS().diff] || RDIFF.normal,
        start:c.currentTime + (cfg.mic ? 1.2 : 0.6), bus:c.createGain(), curBar:-1, flash:{}, finalBar:false, raw:[]};
  RG.bus.connect(AE.master);
  if(cfg.mic){

      .catch(err => { if(RG === me){ me.cfg.mic = false; const tz = $('#tapzone'); if(tz) tz.innerHTML = `<div class="small" style="padding:10px">${micErrorHTML(err)}<br>このままタップでも続けられます。</div>`; } });
  }

function evOffset(b, bar){
  let off = b * bar.beat;
  const frac = b - Math.floor(b);
  if(bar.swing === 16 && (Math.abs(frac - .25) < 1e-6 || Math.abs(frac - .75) < 1e-6)) off += bar.beat / 12;
  if(bar.swing === 8 && Math.abs(frac - .5) < 1e-6) off += bar.beat / 6;
  return off;
}
function rgGenerate(){
  const c = AE.ctx, horizon = c.currentTime + Math.max(2.6, 4.8 * 60 / (RG.cfg.bpm || 100));   // 遅いテンポでも次の小節まで先に用意(表示用)
  while(!RG.finalBar && !RG.ended){
    const i = RG.bars.length;
    const prev = RG.bars[i - 1];
    const t0 = prev ? prev.t0 + prev.dur : RG.start;
    if(t0 > horizon) break;
    const b = RG.cfg.bar(i, RG);
    if(!b){ RG.finalBar = true; RG.endTime = t0; break; }
    b.i = i; b.t0 = t0; b.bpm = b.bpm || RG.cfg.bpm; b.beat = 60 / b.bpm; b.beats = b.beats || 4; b.dur = b.beats * b.beat;
    b.events = (b.events || []).map(e => Object.assign({}, e)).sort((x, y) => x.b - y.b);
    b.events.forEach(e => e.time = t0 + evOffset(e.b, b));
    const clk = b.click || 'all';
    for(let k = 0; k < b.beats; k++){
      if(clk === 'all' || (clk === 'backbeat' && k % 2 === 1)) clickAt(t0 + k * b.beat, k === 0 && clk === 'all', RG.bus, !!RG.cfg.mic);
    }
    if(b.sound) b.events.forEach(e => RG.cfg.sound(e, e.time, RG.bus));
    if(b.extra) b.extra(t0, RG.bus, b);
    if(b.judge) b.events.forEach(e => { e.bar = i; e.judged = false; e.judge = null; e.dtMs = null; RG.notes.push(e); });
    RG.bars.push(b);
  }
}
function lateWindow(){ return RG.diff.miss / 1000 + .12 + Math.max(0, RS().calibMs / 1000) + (AE.ctx.outputLatency || 0); }
function rgTick(){
  if(!RG || RG.ended) return;
  const now = AE.ctx.currentTime;
  rgGenerate();
  const lateW = lateWindow();
  for(const n of RG.notes){
    if(n.judged) continue;
    if(n.time > now) break;
    if(n.time < now - lateW) rgJudge(n, null);
  }
  for(const b of RG.bars){
    if(!b.closed && b.t0 + b.dur + lateW < now){ b.closed = true; if(RG.cfg.onBarEnd) RG.cfg.onBarEnd(b, RG); if(!RG || RG.ended) return; }
  }
  if(RG.finalBar && now > RG.endTime + lateW + .25) rgEnd();
}
function barAt(t){ return RG.bars.find(b => t >= b.t0 && t < b.t0 + b.dur); }
function rgTap(input = {}){
  if(!RG || RG.ended) return;
  const c = ac(), now = c.currentTime;
  const tapT = input.t != null ? input.t : now - (c.outputLatency || 0) - RS().calibMs / 1000;
  RG.raw.push(tapT);
  const wideW = RG.diff.miss / 1000 + .06;
  let cand = null, bd = 1e9;
  for(const n of RG.notes){
    if(n.judged) continue;
    const d = Math.abs(tapT - n.time);
    if(n.time - tapT > wideW + .5) break;
    if(d < bd){ bd = d; cand = n; }
  }
  if(RG.cfg.mode === 'lanes' && input.lane != null){
    let best = null, bb = 1e9;
    for(const n of RG.notes){
      if(n.judged || n.lane !== input.lane) continue;
      const d = Math.abs(tapT - n.time);
      if(n.time - tapT > wideW + .5) break;
      if(d < bb){ bb = d; best = n; }
    }
    if(best && bb <= wideW){ cand = best; bd = bb; }
  }
  const hit = cand && bd <= wideW ? cand : null;
  if(!input.mic) RG.cfg.tapSound(input, hit, RG.bus, now);
  else{ const tz = $('#tapzone'); if(tz) ripple(tz, tz.clientWidth / 2, tz.clientHeight / 2); }
  if(RG.cfg.mode === 'lanes' && input.lane != null) RG.flash[input.lane] = {t:performance.now(), j:null};
  if(!hit){
    const bar = barAt(tapT);
    if(!bar || !bar.judge){ if(!input.mic) showRJudge(null, null, bar && bar.hint ? bar.hint : '👂 まだ採点前'); return; }
    RG.extra++; RG.combo = 0;
    showRJudge('X', null);
    return;
  }
  let wrong = null;
  if(RG.cfg.mode === 'lanes' && input.lane != null && hit.lane !== input.lane) wrong = 'lane';
  if(RG.cfg.du && input.dir && hit.d && hit.d !== 'X' && hit.d !== 'T' && input.dir !== hit.d) wrong = 'dir';
  rgJudge(hit, tapT - hit.time, wrong);
}
function rgJudge(n, dt, wrong){

    j = a <= d.p ? 'P' : a <= d.g ? 'G' : a <= d.o ? 'O' : 'M';
    n.dtMs = ms;

    if(wrong === 'dir' && (j === 'P' || j === 'G')) j = 'O';

  n.judge = j; n.wrong = wrong;
  RG.counts[j]++;

  else{ RG.score += j === 'P' ? 100 : j === 'G' ? 70 : 40; RG.combo++; RG.maxCombo = Math.max(RG.maxCombo, RG.combo); }
  if(n.lane != null) RG.flash[n.lane] = {t:performance.now(), j};
  if(RG.cfg.onJudge) RG.cfg.onJudge(n, j, RG);

}

    dd.rN = (dd.rN || 0) + ok.length; dd.rAbs = (dd.rAbs || 0) + ok.reduce((a, n) => a + Math.abs(n.dtMs), 0); dd.rSum = (dd.rSum || 0) + ok.reduce((a, n) => a + n.dtMs, 0); }

// 落ちてくるノーツ(レーン)
function drawHighway(now){
  const cv = $('#hwCanvas'); if(!cv) return;
  const W = cv.clientWidth, H = cv.clientHeight;
  if(!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  if(cv.width !== Math.round(W * dpr)){ cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const css = getComputedStyle(document.documentElement);
  g.clearRect(0, 0, W, H);
  const lanes = RG.cfg.lanes, n = lanes.length, lw = W / n;
  const hitY = H - 18, win = 2.1 / (RS().speed || 1);
  const yOf = t => hitY - (t - now) / win * (hitY - 10);
  lanes.forEach((l, i) => {
    g.fillStyle = l.off ? 'rgba(128,128,128,.05)' : hexA(l.color, .08);
    g.fillRect(i * lw + 1, 0, lw - 2, H);
    const f = RG.flash[i];
    if(f){
      const a = 1 - (performance.now() - f.t) / 260;
      if(a > 0){ g.fillStyle = hexA(f.j ? JCOL[f.j] : l.color, .35 * a); g.fillRect(i * lw + 1, 0, lw - 2, hitY + 12); }
    }
  });
  // 拍線
  g.lineWidth = 1;
  RG.bars.forEach(b => {
    for(let k = 0; k < b.beats; k++){
      const y = yOf(b.t0 + k * b.beat);
      if(y < -5 || y > H) continue;
      g.strokeStyle = k === 0 ? 'rgba(128,128,128,.55)' : 'rgba(128,128,128,.2)';
      g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
    }
  });
  // 判定ライン
  g.fillStyle = css.getPropertyValue('--text'); g.globalAlpha = .7; g.fillRect(0, hitY - 1.5, W, 3); g.globalAlpha = 1;
  // ノーツ
  const hide = RG.cfg.hideLanes;
  for(const nt of RG.notes){
    const y = yOf(nt.time);
    if(y < -30) break;
    if(y > H + 20) continue;
    if(nt.hidden && !nt.judged) continue;
    if(nt.judged && nt.judge !== 'M') continue;
    const l = lanes[nt.lane];
    const tail = nt.durT ? Math.max(0, yOf(nt.time) - yOf(nt.time + nt.durT) - 6) : 0;
    if(hide && !nt.judged){
      g.fillStyle = 'rgba(128,128,128,.55)';
      roundRect(g, 6, y - 7, W - 12, 14, 7); g.fill();
      continue;
    }
    const x = nt.lane * lw + lw / 2;
    if(tail){ g.fillStyle = hexA(l.color, .3); g.fillRect(x - 5, y - tail, 10, tail); }
    g.fillStyle = nt.judged ? 'rgba(229,86,75,.35)' : l.color;
    roundRect(g, nt.lane * lw + 5, y - 12, lw - 10, 24, 12); g.fill();
    if(!nt.judged && lw > 34){
      g.fillStyle = l.ink || '#fff'; g.font = `800 ${Math.min(15, lw / 3.2)}px "Hiragino Sans",sans-serif`;
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(RG.cfg.noteLabel === false ? '' : l.label, x, y + 1);
    }
  }
}
function roundRect(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function hexA(hex, a){
  if(!hex || hex[0] !== '#') return `rgba(128,128,128,${a})`;
  const v = parseInt(hex.slice(1), 16);
  return `rgba(${v >> 16 & 255},${v >> 8 & 255},${v & 255},${a})`;
}

/* =====================================================================
   リズム:モード(レッスン/ヒーロー/エコー/サバイバル)

function patToEvents(pat){ return pat.map(([b, d]) => ({b, d})); }
function startRLesson(id, tier){
  const l = LESSONS[id], bpm = l.bpms[tier];
  const P = 8, L = l.demo;
  const pats = [];
  for(let m = 0; m < P; m++){
    if(l.rt === 'sight') pats.push(genRhythmBar(l.level).hits.map(b => [b, 'T']));
    else pats.push(l.patGen ? l.patGen(m) : l.pat);
  }
  const isStrum = l.rt === 'strum';
  const mic = inputMode(l) === 'mic';
  const du = isStrum && RS().du && !mic;
  const nota = !!l.nota || (notaMode() !== 'grid' && l.rt !== 'pulse') || !!l.syll;
  rgStart({
    title:`${l.track.icon} ${l.t}`, mode:'bar', bpm, du, mic, nota, syll:!!l.syll, strumNota:isStrum,
    bar(i){
      if(i < L) return {type:'listen', events:patToEvents(pats[i % P]), sound:true, swing:l.swing, click:l.click ? l.click(0) : 'all', label:`👂 お手本 ${i + 1}/${L}(採点なし)`, hint:'👂 お手本中'};
      if(i === L) return {type:'count', events:[], label:'🎯 カウント', hint:'🎯 もうすぐ!'};
      const m = i - L - 1;
      if(m >= P) return null;
      const clk = l.click ? l.click(m) : 'all';
      return {type:'play', events:patToEvents(pats[m]), judge:true, swing:l.swing, click:clk, label:`▶ ${m + 1} / ${P} 小節${clk === 'none' ? ' 🔇 クリックなし—キープ!' : ''}`};
    },
    sound(e, t, bus){ isStrum ? strumAt(t, e.d, bus) : percAt(t, bus); },
    tapSound(inp, n, bus, t){ isStrum ? strumAt(t, n ? (du && inp.dir ? inp.dir : n.d) : (inp.dir || 'X'), bus) : percAt(t, bus, true); },
    onEnd(res){ finishRLesson(l, tier, res); },
  });
}
function finishRLesson(l, tier, res){
  const ls = state.lessons[l.id] || (state.lessons[l.id] = {best:0, stars:0, plays:0, last:0, tiers:{}});
  ls.tiers = ls.tiers || {};
  ls.plays++; ls.last = Date.now();
  const prev = ls.tiers[tier];
  const newRec = !prev || res.acc > prev.acc;
  if(newRec) ls.tiers[tier] = {acc:res.acc, rank:res.rank, score:res.score};
  const oldStars = ls.stars || 0;
  ls.stars = [0,1,2].filter(t => ls.tiers[t] && RANK_N[ls.tiers[t].rank] >= RANK_N.B).length;
  ls.best = Math.round(Math.max(...Object.values(ls.tiers).map(t => t.acc)) * 10);
  const notices = [];
  if(newRec && prev) notices.push('✨ 自己ベスト更新!');
  if(ls.stars > oldStars){
    notices.push(`★${ls.stars} 獲得!`);
    if(!oldStars){ const nx = l.track.lessons[l.idx + 1]; notices.push(nx ? `🔓 次のレッスン解放:${nx.t}` : `🏆 ${l.track.name} 全レッスン突破!`); }
  }
  if(res.rank === 'S') state.totals.rS = (state.totals.rS || 0) + 1;
  state.totals.rrounds = (state.totals.rrounds || 0) + 1;
  const xp = Math.round(res.acc * 30) + 10 + (ls.stars > oldStars ? 15 : 0) + (res.rank === 'S' ? 10 : 0);
  addXP(xp);
  const d = today(); d.done.rhythm = true;
  planCheck(notices);
  save();
  const next = tier + 1 < l.bpms.length ? {label:`♩${l.bpms[tier + 1]} に挑戦 ▶`, fn:() => startRLesson(l.id, tier + 1)}
             : l.track.lessons[l.idx + 1] && ls.stars ? {label:'次のレッスン ▶', fn:() => openRLesson(l.track.lessons[l.idx + 1].id)} : null;
  renderRResult(res, {title:`${l.track.icon} ${l.t} ♩=${l.bpms[tier]}`, xp, notices, newRec, retry:() => startRLesson(l.id, tier), next});
}

/* ---------- ソルフェ・ヒーロー ---------- */
function startHero(songId, ear, slow){
  const song = SONGS.find(s => s.id === songId);
  const {ev, beats} = parseSong(song);
  const used = [...new Set(ev.map(e => e.deg))].sort((a, b) => a - b);
  const kpc = ri(12), tonic = 55 + mod(kpc - 7, 12);       // ド = G3〜F#4
  const lanes = used.map(d => ({deg:d, label:SOLFA7[d], color:DEG_COLOR[MAJOR[d]], ink:DEG_INK[MAJOR[d]], midi:tonic + MAJOR[d]}));
  const laneOf = d => used.indexOf(d);
  const nBars = Math.ceil(beats / 4);
  const bpm = Math.round(song.bpm * (slow ? .8 : 1));
  rgStart({
    title:`🎹 ${song.t}${ear ? '(耳コピ)' : ''}`, mode:'lanes', bpm, lanes, hideLanes:ear,
    bar(i){
      if(i === 0) return {type:'listen', events:[0,.5,1,1.5,2,2.5,3,3.5].map((b, k) => ({b, midi:tonic + [0,2,4,5,7,9,11,12][k]})), sound:true, label:`🎼 キー ${keyName(mod(tonic, 12))}:ドレミファソラシド`, hint:'🎼 キーを確認中'};
      if(i === 1) return {type:'count', events:[], label:'🎯 READY', extra:(t, bus) => noteAt(tonic - 12, t, .3, 1.5, bus)};
      const m = i - 2;
      if(m >= nBars) return null;
      const events = ev.filter(e => e.b >= m * 4 && e.b < m * 4 + 4).map(e => ({b:e.b - m * 4, lane:laneOf(e.deg), midi:tonic + e.semi, durT:e.dur * 60 / bpm}));
      return {type:'play', events, judge:true, label:`▶ ${m + 1} / ${nBars}`};
    },
    sound(e, t, bus){ noteAt(e.midi, t, .5, .26, bus); },
    tapSound(inp, n, bus, t){
      const midi = n && n.lane === inp.lane ? n.midi : lanes[inp.lane].midi;
      noteAt(midi, t, .6, n && n.durT ? Math.min(1.2, n.durT) : .5, bus);
    },
    onEnd(res){
      const key = songId + (ear ? ':ear' : '');
      const a = state.arcade.hero[key] || {};
      const fc = res.counts.M === 0 && res.extra === 0 && res.total > 0;
      const newRec = !a.acc || res.acc > a.acc;
      if(newRec) state.arcade.hero[key] = {acc:res.acc, rank:res.rank, score:res.score, fc:fc || a.fc};
      else if(fc) a.fc = true;
      if(fc) state.totals.heroFC = (state.totals.heroFC || 0) + 1;
      const dbl = songOfDay().id === songId;
      const xp = (Math.round(res.acc * 40) + 10) * (dbl ? 2 : 1);
      addXP(xp);
      today().done.arcade = true;
      const notices = [];
      if(fc) notices.push('🎉 FULL COMBO!');
      if(newRec && a.acc) notices.push('✨ 自己ベスト更新!');
      if(dbl) notices.push('📅 今日の1曲ボーナス XP×2');
      const idx = SONGS.indexOf(song);
      if(RANK_N[res.rank] >= RANK_N.B && SONGS[idx + 1] && !songUnlocked(idx + 1, true)) notices.push(`🔓 新曲解放:${SONGS[idx + 1].t}`);
      state.arcade.heroClear = state.arcade.heroClear || {};
      if(RANK_N[res.rank] >= RANK_N.B) state.arcade.heroClear[songId] = true;
      planCheck(notices);
      save();
      renderRResult(res, {title:`🎹 ${song.t}${ear ? '(耳コピ)' : ''} ♩=${bpm}`, xp, notices, newRec, retry:() => startHero(songId, ear, slow),
        next: ear ? null : {label:'耳コピモードで ▶', fn:() => startHero(songId, true, slow)}});
    },
  });
}
function songUnlocked(i, before){
  if(i === 0) return true;
  const c = (state.arcade.heroClear || {});
  return !!c[SONGS[i - 1].id] || !!c[SONGS[i].id];
}
function songOfDay(){ const un = SONGS.filter((_, i) => songUnlocked(i)); return un[Math.floor(Date.now() / 864e5) % un.length]; }

/* ---------- エコー・セッション(聴いて→まねる) ---------- */
const ECHO_LV = [
  {set:[0,4,7],        rh:'q',  n:[2,3]},
  {set:[0,2,4,7],      rh:'q',  n:[3,4]},
  {set:[0,2,4,5,7],    rh:'q',  n:[3,4]},
  {set:[0,2,4,5,7],    rh:'e',  n:[3,5]},
  {set:[0,2,4,5,7,9],  rh:'e',  n:[4,5]},
  {set:MAJOR,          rh:'e',  n:[4,6]},
  {set:MAJOR,          rh:'s',  n:[4,6]},
];
function echoPhrase(lv){
  const L = ECHO_LV[Math.min(lv, ECHO_LV.length - 1)];
  const slots = L.rh === 'q' ? [0,1,2,3] : L.rh === 'e' ? [0,1,1.5,2,2.5,3] : [0,.5,1,1.5,2,2.5,3,3.5];
  const cnt = L.n[0] + ri(L.n[1] - L.n[0] + 1);
  const pos = [0, ...shuffle(slots.filter(x => x > 0)).slice(0, cnt - 1)].sort((a, b) => a - b);
  let idx = L.set.indexOf(pick([0, 4, 7].filter(x => L.set.includes(x))));
  return pos.map(b => {
    const step = pick([-2,-1,-1,0,1,1,2]);
    idx = clamp(idx + step, 0, L.set.length - 1);
    return {b, semi:L.set[idx]};
  });
}
function startEcho(){
  const kpc = ri(12), tonic = 55 + mod(kpc - 7, 12);
  const lanes = MAJOR.map((s, d) => ({deg:d, label:SOLFA7[d], color:DEG_COLOR[s], ink:DEG_INK[s], midi:tonic + s}));
  const E = {cleared:0, level:0, phrase:null, results:[]};
  const bpmOf = () => Math.min(132, 76 + E.cleared * 2);
  const cfg = {
    title:'🔁 エコー・セッション', mode:'lanes', bpm:76, lanes, lives:3,
    bar(i, R){
      if(i === 0) return {type:'listen', events:[0,.5,1,1.5,2,2.5,3,3.5].map((b, k) => ({b, midi:tonic + [0,2,4,5,7,9,11,12][k]})), sound:true, bpm:bpmOf(), label:`🎼 キー ${keyName(kpc)}:ドレミファソラシド`, hint:'🎼 キーを確認中'};
      const bpm = bpmOf();
      if(i % 2 === 1){
        E.level = Math.floor(E.cleared / 3);
        E.phrase = echoPhrase(E.level);
        const setNow = ECHO_LV[Math.min(E.level, ECHO_LV.length - 1)].set;
        return {type:'call', bpm, events:E.phrase.map(p => ({b:p.b, midi:tonic + p.semi})), sound:true, label:`👂 聴いて(Lv${E.level + 1})`, hint:'👂 まずは聴いて!', set:setNow,
                extra:(t, bus) => noteAt(tonic - 12, t, .22, 1.2, bus)};
      }
      return {type:'resp', bpm, events:E.phrase.map(p => ({b:p.b, lane:MAJOR.indexOf(p.semi), midi:tonic + p.semi, hidden:true})), judge:true, label:'🎸 まねして弾こう!',
              extra:(t, bus) => noteAt(tonic - 12, t, .22, 1.2, bus)};
    },
    onBarStart(b){
      const ov = $('#hwOver');
      if(b.type === 'call'){
        ov.innerHTML = '<div class="ov-big">👂 LISTEN</div>'; ov.className = 'hw-over show listen';
        lanes.forEach((l, k) => l.off = !b.set.includes(MAJOR[k]));

      }else if(b.type === 'resp'){ ov.innerHTML = '<div class="ov-big">🎸 YOUR TURN</div>'; ov.className = 'hw-over show turn'; }
      else ov.className = 'hw-over';
    },
    sound(e, t, bus){ noteAt(e.midi, t, .55, .3, bus); },
    tapSound(inp, n, bus, t){ noteAt(n && n.lane === inp.lane ? n.midi : lanes[inp.lane].midi, t, .6, .35, bus); },
    onBarEnd(b, R){
      if(b.type !== 'resp') return;
      const ns = R.notes.filter(n => n.bar === b.i);
      const ok = ns.length && ns.every(n => n.judge !== 'M');
      E.results.push(ok);
      const ov = $('#hwOver');
      if(ok){
        E.cleared++; R.score += 50 * (E.level + 1);
        ov.innerHTML = `<div class="ov-big">✨ CLEAR ${E.cleared}</div>`; ov.className = 'hw-over show ok';
        if(S().sfx) sfx('ok');
      }else{
        R.lives--;
        ov.innerHTML = `<div class="ov-big">💔 ${ns.map(n => n.judge === 'M' ? `<span style="color:${DEG_COLOR[MAJOR[n.lane]]}">${SOLFA7[n.lane]}</span>` : '').filter(Boolean).join(' ')}</div><div class="ov-sub">正解:${ns.map(n => SOLFA7[n.lane]).join(' ')}</div>`;
        ov.className = 'hw-over show ng';
        if(S().sfx) sfx('ng');
        if(R.lives <= 0){ setTimeout(() => rgEnd(), 900); R.finalBar = true; R.endTime = AE.ctx.currentTime; }
      }
      updateRHud();
    },
    onEnd(res){
      const a = state.arcade.echo || {};
      const newRec = E.cleared > (a.best || 0);
      if(newRec) state.arcade.echo = {best:E.cleared, level:E.level + 1, score:res.score};
      const xp = 10 + E.cleared * 6;
      addXP(xp);
      today().done.arcade = true;
      const notices = [`🔁 ${E.cleared} フレーズ成功(Lv${E.level + 1}・最高 ♩=${bpmOf()})`];
      if(newRec && a.best) notices.push(`🏆 自己ベスト更新!(前回 ${a.best})`);
      planCheck(notices);
      save();
      renderRResult(res, {title:'🔁 エコー・セッション', xp, notices, newRec, endless:true, big:`${E.cleared}`, bigLabel:'フレーズ', retry:startEcho});
    },
  };
  rgStart(cfg);
}

/* ---------- リズム・サバイバル ---------- */
function startSurvival(){
  const du = RS().du;
  const tiers = [[STRUM.q, STRUM.e], [STRUM.e, STRUM.s1, STRUM.s2], [STRUM.s1, STRUM.s2, STRUM.sync], [STRUM.sync, STRUM.b16, STRUM.ghost], [STRUM.b16, STRUM.ghost, STRUM.a16]];
  const V = {bars:0, pat:null};
  rgStart({
    title:'⚡ リズム・サバイバル', mode:'bar', bpm:72, lives:3, du,
    bar(i){
      if(i === 0) return {type:'count', events:[], label:'🎯 READY', bpm:72};
      const m = i - 1;
      const bpm = Math.min(168, 72 + Math.floor(m / 2) * 3);
      if(m % 2 === 0) V.pat = pick(tiers[Math.min(tiers.length - 1, Math.floor(m / 8))]);
      return {type:'play', events:patToEvents(V.pat), judge:true, bpm, label:`⚡ ${m + 1} 小節目`};
    },
    sound(e, t, bus){ strumAt(t, e.d, bus); },
    tapSound(inp, n, bus, t){ strumAt(t, n ? (du && inp.dir ? inp.dir : n.d) : (inp.dir || 'X'), bus); },
    onJudge(n, j, R){
      if(j === 'M'){ R.lives--; if(R.lives <= 0){ R.finalBar = true; R.endTime = AE.ctx.currentTime; setTimeout(() => rgEnd(), 300); } }
      else if(R.combo > 0 && R.combo % 16 === 0 && R.lives < 3){ R.lives++; toast('❤️ 16コンボで回復!'); }
    },
    onBarEnd(b){ if(b.type === 'play') V.bars = Math.max(V.bars, b.i); },
    onEnd(res){
      const a = state.arcade.surv || {};
      const bars = V.bars;
      const newRec = bars > (a.best || 0);
      if(newRec) state.arcade.surv = {best:bars, score:res.score};
      const xp = 10 + bars * 2;
      addXP(xp);
      today().done.arcade = true;
      const notices = [`⚡ ${bars} 小節 生き残り`];
      if(newRec && a.best) notices.push(`🏆 自己ベスト更新!(前回 ${a.best})`);
      planCheck(notices);
      save();
      renderRResult(res, {title:'⚡ リズム・サバイバル', xp, notices, newRec, endless:true, big:`${bars}`, bigLabel:'小節', retry:startSurvival});
    },
  });
}
function planCheck(notices){
  const d = today();
  if(['mix','lesson','rhythm','arcade'].every(k => d.done[k]) && !d.planDone){
    d.planDone = true; state.totals.planDays++; addXP(30);
    notices.push('✅ 今日のプラン完走!ボーナス +30XP');
  }
}

function setupCanvas(cv){
  const dpr = window.devicePixelRatio || 1;
  if(!cv.dataset.h) cv.dataset.h = cv.getAttribute('height');
  const h = +cv.dataset.h, w = cv.clientWidth;
  cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + 'px';
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [g, w, h];
}
function drawRCharts(res){
  const tl = $('#cvTL'), hs = $('#cvHist');
  if(!tl || !tl.clientWidth){ if(tl) requestAnimationFrame(() => drawRCharts(res)); return; }
  const muted = getComputedStyle(document.documentElement).getPropertyValue('--muted');
  let [g, w, h] = setupCanvas(tl);
  const d = res.diff, lim = Math.max(d.miss, 100), cy = h / 2, sc = (h / 2 - 10) / lim;
  g.fillStyle = hexA(JCOL.P, .12); g.fillRect(0, cy - d.p * sc, w, d.p * sc * 2);
  g.fillStyle = hexA(JCOL.G, .08); g.fillRect(0, cy - d.g * sc, w, (d.g - d.p) * sc); g.fillRect(0, cy + d.p * sc, w, (d.g - d.p) * sc);
  g.strokeStyle = muted; g.globalAlpha = .5; g.beginPath(); g.moveTo(0, cy); g.lineTo(w, cy); g.stroke(); g.globalAlpha = 1;
  const N = res.notes.length || 1;
  res.notes.forEach((n, i) => {
    const x = (i + .5) / N * w;
    if(n.dtMs === null || n.wrong === 'lane'){ g.fillStyle = JCOL.M; g.beginPath(); g.arc(x, h - 6, 3, 0, 7); g.fill(); return; }
    g.fillStyle = JCOL[n.judge]; g.beginPath(); g.arc(x, cy + clamp(n.dtMs, -lim, lim) * sc, 3.5, 0, 7); g.fill();
  });
  [g, w, h] = setupCanvas(hs);
  const bw = 10, nb = 20, bins = new Array(nb).fill(0);
  res.notes.forEach(n => { if(n.dtMs === null || n.wrong === 'lane') return; const v = clamp(n.dtMs, -100, 99.9); bins[Math.floor((v + 100) / bw)]++; });
  const mx = Math.max(1, ...bins), barW = w / nb;
  bins.forEach((cnt, i) => {
    const a = Math.abs(-100 + i * bw + bw / 2);
    g.fillStyle = a <= d.p ? JCOL.P : a <= d.g ? JCOL.G : a <= d.o ? JCOL.O : JCOL.M;
    const bh = cnt / mx * (h - 22); g.fillRect(i * barW + 1, h - 16 - bh, barW - 2, bh);
  });
  g.fillStyle = muted; g.font = '10px sans-serif'; g.textAlign = 'center';
  g.fillText('-100ms', 22, h - 3); g.fillText('0', w / 2, h - 3); g.fillText('+100ms', w - 24, h - 3);
}

/* ---------- タップ遅延キャリブレーション ---------- */
let calib = null;
function openCalib(){
  ac();
  openSheet(`
    <div class="sheet-head"><h3>🎚️ タップ遅延の調整</h3><button class="icon-btn" onclick="calib=null;closeSheet()">✕</button></div>
    <p class="small">クリックが16回鳴ります。音に<b>ぴったり合わせて</b>下のエリアをタップ(PCはスペースキー)。端末の音とタッチの遅れを自動で補正します。</p>
    <div class="center" style="font-size:34px;font-weight:900;height:48px;margin:10px 0" id="calCount"></div>
    <div class="tapzone" id="calTap" style="height:150px"><span>ここをタップ</span></div>
    <p class="center small" id="calRes" style="margin:10px 0">現在の補正値:<b>${RS().calibMs}</b> ms</p>
    <div class="center"><button class="btn primary big" id="calGo">スタート</button></div>`);
  $('#calTap').addEventListener('pointerdown', e => { e.preventDefault(); calibTap(); ripple($('#calTap'), e.offsetX, e.offsetY); });
  $('#calGo').onclick = startCalib;
}
function startCalib(){
  const c = ac(), N = 16, iv = 60 / 90, start = c.currentTime + .6;
  calib = {clicks:[], taps:[], start, iv, N};
  for(let i = 0; i < N; i++){ const t = start + i * iv; calib.clicks.push(t); clickAt(t, i % 4 === 0); }
  $('#calGo').style.display = 'none';
  $('#calRes').textContent = '音に合わせてタップ!';
  const tick = () => {
    if(!calib) return;
    const now = c.currentTime, i = Math.floor((now - start) / iv);
    if(i >= 0 && i < N && $('#calCount')) $('#calCount').textContent = `${i + 1} / ${N}`;
    if(now > start + N * iv + .6){ finishCalib(); return; }
    requestAnimationFrame(tick);
  };
  tick();
}
function calibTap(){ if(calib) calib.taps.push(AE.ctx.currentTime - (AE.ctx.outputLatency || 0)); }
function finishCalib(){
  const offs = [];
  calib.taps.forEach(tp => {
    let bd = 1e9, bi = -1;
    calib.clicks.forEach((c, i) => { const d = Math.abs(tp - c); if(d < bd){ bd = d; bi = i; } });
    if(bi >= 4 && bd < calib.iv / 2) offs.push((tp - calib.clicks[bi]) * 1000);
  });
  const go = $('#calGo'); if(go) go.style.display = '';
  const cc = $('#calCount'); if(cc) cc.textContent = '';
  const out = $('#calRes');
  if(offs.length < 6){ if(out) out.innerHTML = `タップ数が足りませんでした。もう一度どうぞ(現在:<b>${RS().calibMs}</b> ms)`; calib = null; return; }
  offs.sort((a, b) => a - b);
  RS().calibMs = Math.round(offs[Math.floor(offs.length / 2)]); RS().calibrated = true; save(); checkAch();
  if(out) out.innerHTML = `✅ 補正値を <b>${RS().calibMs}</b> ms に設定しました<br><span class="muted">(プラス=タップが音より遅れて届く端末)</span>`;
  calib = null;
}

/* =====================================================================
   リズム聴音(クイズ形式)
   ===================================================================== */
function rhythmGridHTML(hits, grid){
  const set = new Set(hits.map(h => Math.round(h * grid)));
  let h = '<div class="rgrid">';
  for(let b = 0; b < 4; b++){
    h += '<div class="rg-beat">';
    for(let k = 0; k < grid; k++) h += `<i class="${set.has(b * grid + k) ? 'on' : ''}${k === 0 ? ' head' : ''}"></i>`;
    h += '</div>';
  }
  return h + '</div>';
}
GEN.rhythmDict = function(p){
  const L = RLEVEL[p.level], grid = L.grid;
  const ans = genRhythmBar(p.level);
  const opts = [ans.hits];
  const keys = new Set([rkey(ans.hits)]);
  const names = Object.keys(L.cells);
  for(let tries = 0; opts.length < 4 && tries < 200; tries++){
    const cells = ans.cells.slice();
    const k = ri(4);
    cells[k] = pick(names.filter(n => n !== cells[k]));
    if(tries > 60){ const k2 = ri(4); cells[k2] = pick(names); }
    const hits = cells.flatMap((c, b) => CELLS[c].map(x => b + x));
    if(hits.length < 2) continue;
    const key = rkey(hits);
    if(keys.has(key)) continue;
    keys.add(key); opts.push(hits);
  }
  const bpm = p.bpm, beat = 60 / bpm;
  const playIt = () => {
    stopAll(); const c = ac(); const t0 = c.currentTime + .15;
    for(let k = 0; k < 4; k++) clickAt(t0 + k * beat, k === 0);
    const s = t0 + 4 * beat;
    for(let k = 0; k < 4; k++) clickAt(s + k * beat, false);
    ans.hits.forEach(h => percAt(s + h * beat));
  };
  const order = shuffle(opts);
  return {
    kind:'choice',
    prompt:`クリック4つのあとの1小節。聴こえたリズムは?<span class="small muted" style="display:block;font-weight:400">${(p.view || notaMode()) === 'note' ? '音符の譜面から選ぼう' : `■=叩く位置(1拍を${grid === 3 ? '3' : '4'}つに分割)`}</span>`,
    play: playIt,
    replays:[{label:'🐢 ゆっくり', fn(){ stopAll(); const c = ac(), b2 = beat * 1.35, t0 = c.currentTime + .15; for(let k = 0; k < 8; k++) clickAt(t0 + k * b2, k % 4 === 0); ans.hits.forEach(h => percAt(t0 + 4 * b2 + h * b2)); }}],
    options: order.map(hits => ({value:rkey(hits), html: (p.view || notaMode()) === 'note' ? `<div class="rnota-opt">${rhythmNotationSVG(hits, {h:80})}</div>` : (p.view || notaMode()) === 'both' ? `<div class="rnota-opt">${rhythmNotationSVG(hits, {h:80})}</div>${rhythmGridHTML(hits, grid)}` : rhythmGridHTML(hits, grid)})),
    correct: rkey(ans.hits),
    optClass:'rhythm',
    explain:'正解の譜面を確認しよう',
    after(){ setTimeout(playIt, 200); },
    keys:['rd:' + p.level],
  };
};

let VG = null;

// 声のレッスンのキー:標準は C 固定。設定で D〜A 固定またはランダム
function voiceKpc(){ return state.voice.key === 'rand' ? ri(12) : (VKEYS[state.voice.key] ?? 0); }
function voiceKeyLabel(kpc){ return `キー ${keyName(kpc)}${state.voice.key === 'rand' ? '(ランダム)' : '(固定)'}`; }
// お手本の高さ:「あなたの声の高さ」を測っていれば、その近くのオクターブで鳴らす
function voiceTonic(kpc){
  const home = state.voice.home;
  if(home){
    let best = 48 + kpc, bd = 1e9;
    for(let o = 2; o <= 6; o++){ const t = kpc + 12 * o; const d = Math.abs(t + 4 - home); if(d < bd){ bd = d; best = t; } }
    return best;
  }
  return 48 + kpc + (state.voice.high ? 12 : 0);
}
const midiName = m => fmtSpellPlain(spell(Math.round(m)), 'abc') + (Math.floor(Math.round(m) / 12) - 1);

/* ---------- 人の声のお手本(「あー」をフォルマント合成) ---------- */
// のこぎり波(声帯)→ 母音「あ」の共鳴(フォルマント)3つ → ゆるいビブラート。dest を省略すると master
function voiceTone(midi, t, dur, vol = .55, dest, sustain){
  const c = ac(); if(!c) return null;
  const f = midiHz(midi);
  const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(f, t);
  const lfo = c.createOscillator(), lg = c.createGain();
  lfo.frequency.value = 5.3;
  lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * .007, t + .7);
  lfo.connect(lg); lg.connect(o.frequency);
  const female = f > 210;
  const F = female ? [[850, 1, 90], [1220, .55, 100], [2810, .3, 140]] : [[730, 1, 80], [1090, .5, 90], [2440, .28, 130]];
  const sum = c.createGain(); sum.gain.value = 1;
  F.forEach(([fr, a, bw]) => {
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = fr; bp.Q.value = fr / bw;
    const g = c.createGain(); g.gain.value = a;
    o.connect(bp); bp.connect(g); g.connect(sum);
  });
  // 基音も少し足して音程感をはっきりさせる
  const fund = c.createOscillator(), fg = c.createGain(); fund.type = 'sine'; fund.frequency.value = f; fg.gain.value = .35;
  lg.connect(fund.frequency); fund.connect(fg); fg.connect(sum);
  const env = c.createGain();
  const peak = vol * 1.6;
  env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(peak, t + .09);
  if(!sustain){ env.gain.setValueAtTime(peak, t + dur); env.gain.exponentialRampToValueAtTime(0.0001, t + dur + .28); }
  sum.connect(env); env.connect(dest || AE.master);
  const end = sustain ? t + 600 : t + dur + .32;
  [o, lfo, fund].forEach(n => { n.start(t); n.stop(end); });
  if(!dest && !sustain) track(o, t + dur);
  return {stop(){ try{ const n = c.currentTime; env.gain.cancelScheduledValues(n); env.gain.setValueAtTime(env.gain.value, n); env.gain.exponentialRampToValueAtTime(0.0001, n + .2); [o, lfo, fund].forEach(x => x.stop(n + .25)); }catch(e){} }};
}

function voiceGrowthSVG(){
  const pts = [];
  for(let i = -29; i <= 0; i++){
    const d = state.days[dayOffset(i)];
    if(d && d.vN) pts.push({i, v:d.vAbs / d.vN});

  if(pts.length < 1) return '<p class="small muted">発声レッスンをすると、ここに毎日の「音程の平均ずれ」が記録されます。</p>';
  const W = 320, H = 130, mx = Math.max(60, ...pts.map(p => p.v));
  const x = i => 24 + (i + 29) / 29 * (W - 34), y = v => 10 + (1 - v / mx) * (H - 30);
  let h = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:520px;display:block">`;
  [10, 25, 50].filter(v => v < mx).forEach(v => { h += `<line x1="24" x2="${W - 10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" stroke-dasharray="3 3"/><text x="2" y="${y(v) + 4}" font-size="9" fill="var(--muted)">${v}¢</text>`; });
  h += `<rect x="24" y="${y(25)}" width="${W - 34}" height="${y(0) - y(25)}" fill="rgba(63,191,106,.12)"/>`;
  h += `<polyline fill="none" stroke="var(--brand)" stroke-width="2.5" points="${pts.map(p => `${x(p.i)},${y(p.v)}`).join(' ')}"/>`;
  pts.forEach(p => { h += `<circle cx="${x(p.i)}" cy="${y(p.v)}" r="3.5" fill="var(--brand)"/>`; });
  h += `<text x="24" y="${H - 4}" font-size="9" fill="var(--muted)">30日前</text><text x="${W - 10}" y="${H - 4}" font-size="9" fill="var(--muted)" text-anchor="end">今日</text></svg>`;
  const first = pts[0].v, last = pts[pts.length - 1].v;
  return h + `<p class="small" style="margin-top:4px">最新 <b>${Math.round(last)}¢</b>${pts.length > 1 ? `(最初 ${Math.round(first)}¢ → ${last < first ? '<b style="color:var(--good)">' + Math.round(first - last) + '¢ 改善!</b>' : 'これから伸びます'})` : ''} ・ 緑の帯(±25¢以内)が目標</p>`;
}

function voiceRangeHTML(){

  const lo = Math.min(...log.map(r => r.lo)) - 2, hi = Math.max(...log.map(r => r.hi)) + 2;

    <div class="vbar" style="height:18px"><span style="position:absolute;top:3px;bottom:3px;left:${pct(r.lo)}%;width:${pct(r.hi) - pct(r.lo)}%;background:linear-gradient(90deg,#4C9BEA,#E5564B);border-radius:6px"></span></div>
    <span class="small" style="width:118px;text-align:right">${midiName(r.lo)}〜${midiName(r.hi)}</span></div>`).join('')
    + `<p class="small muted" style="margin-top:4px">最新の声域:<b>${Math.round(log[log.length - 1].hi - log[log.length - 1].lo)}半音</b>(1オクターブ=12半音)</p>`;

async function startVoice(id){
  const l = vLesson(id), v = l.voice;
  ac(); stopAll(); droneStop();
  const kpc = voiceKpc();
  const targets = v.items ? v.items() : v.mode === 'task' ? v.tasks().map(task => ({task}))
                                  : v.seq().map(s => v.harm ? {guide:s, semi:harmUp(s)} : {semi:s});
  const mode = targets.every(t => t.task) ? 'task' : 'match';
  const style = v.style || (v.kid ? 'kid' : null);
  VG = {l, v, mode, style, kid:style === 'kid', pass:!!style, tol:v.tol || 25, attempts:v.attempts || 1, kpc, tonic:voiceTonic(kpc), minor:!!v.minor,
        targets, i:-1, tries:0, phase:'init', res:[], trace:[], samples:[], all:[], voiced:0, anyV:0, okV:0,
        hold:v.hold || VHOLD, alive:true, ranges:[]};
  document.body.classList.add('in-game');
  showView('vplay');
  buildVPlay();
  try{ await micStart(vFrame); }
  catch(e){
    $('#vMsg').innerHTML = `<div class="mic-err small">${micErrorHTML(e)}</div><div class="row wrap" style="justify-content:center;margin-top:10px"><button class="btn primary" onclick="startVoice('${id}')">🎤 もう一度試す</button><button class="btn" onclick="micTest()">マイクのテスト</button></div>`;
    return;
  }
  VG.raf = requestAnimationFrame(vDraw);
  if(mode === 'match') vRef(); else vNext();
}

function harmUp(s){ const i = MAJOR.indexOf(mod(s, 12)); const up = MAJOR[(i + 2) % 7] + (i + 2 >= 7 ? 12 : 0); return up + (s - mod(s, 12)); }
function vRef(){
  const me = VG;
  VG.phase = 'ref';
  $('#vMsg').innerHTML = VG.kid ? '🐸「まずは ドレミファソラシド を きいてね」' : `🎼 キー ${keyName(VG.kpc, VG.minor)} を確認中…`;
  setHint('', '👂 よく聴いてください');
  stopAll();
  const end = keyRef(VG.tonic, VG.minor);
  setTimeout(() => { if(VG === me && VG.alive) vNext(); }, end * 1000 + 250);
